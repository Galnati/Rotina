<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rotina</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="theme-color" content="#6A3FD8">
<meta name="description" content="Organize agenda, treinos, estudos, leituras, finanças e hábitos — funciona offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: app de uma coluna estilo iOS — título grande, seções em grupos, barra de abas fixa embaixo, formulários em folhas que sobem da base. Cada área da vida tem sua cor. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#E8EAF0; --fg:#15171C; --muted:#6A7080; --line:rgba(21,23,28,.09);
  --c-agenda:#3768DB; --c-reun:#C97D12; --c-treino:#DA4E39; --c-fin:#1A9466; --c-estudo:#7656DA; --c-tarefa:#108A88; --c-habito:#CF3F74; --c-leitura:#9B6A3C; --c-escrita:#3D5A80; --c-jogo:#8A7413; --wood:#C9A77E;
  --danger:#D23B3B; --on-accent:#FFFFFF; --tabbar:rgba(248,249,251,.86); --shadow:0 1px 2px rgba(21,23,28,.05),0 6px 20px rgba(21,23,28,.05);
  --f-display:"Bricolage Grotesque",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --f-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --surface:#171A20; --surface-2:#242830; --fg:#ECEEF2; --muted:#8E94A2; --line:rgba(236,238,242,.09);
  --c-agenda:#6E95F2; --c-reun:#E9A23F; --c-treino:#F2735F; --c-fin:#3FC28E; --c-estudo:#9C82F2; --c-tarefa:#35B7B4; --c-habito:#EE6C9B; --c-leitura:#D9A06A; --c-escrita:#8FB0D8; --c-jogo:#D6BF4C; --wood:#6B5038;
  --danger:#F06262; --on-accent:#0D0F13; --tabbar:rgba(23,26,32,.86); --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --surface:#171A20; --surface-2:#242830; --fg:#ECEEF2; --muted:#8E94A2; --line:rgba(236,238,242,.09);
  --c-agenda:#6E95F2; --c-reun:#E9A23F; --c-treino:#F2735F; --c-fin:#3FC28E; --c-estudo:#9C82F2; --c-tarefa:#35B7B4; --c-habito:#EE6C9B; --c-leitura:#D9A06A; --c-escrita:#8FB0D8; --c-jogo:#D6BF4C; --wood:#6B5038;
  --danger:#F06262; --on-accent:#0D0F13; --tabbar:rgba(23,26,32,.86); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--c-agenda);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px;margin-bottom:18px}
.top .eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.top h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;margin:2px 0 0;letter-spacing:-.02em;text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent,var(--c-agenda));font-weight:600;font-size:16px;margin-bottom:6px}
.back svg{width:20px;height:20px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}

section.blk{margin-bottom:26px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 8px}
.blk-h h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.blk-h a,.blk-h button.link{color:var(--accent,var(--c-agenda));font-weight:600;font-size:14px;text-decoration:none}
.group{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;width:100%;text-align:left;position:relative}
.row + .row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.row .end{font-size:14px;color:var(--muted);text-align:right;flex:none}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);flex:none;opacity:.6}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.timebox{width:48px;flex:none;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.timebox small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}

.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);border-color:color-mix(in srgb,var(--muted) 50%,transparent);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;opacity:0;color:var(--on-accent)}
.check.on{background:var(--c,var(--c-tarefa));border-color:var(--c,var(--c-tarefa))}
.check.on svg{opacity:1}
.check.sq{border-radius:8px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:left;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:4px;color:var(--c,var(--fg));font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.sm{font-size:clamp(15px,4.6vw,19px);padding-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.chip.on{background:var(--c);color:var(--on-accent);box-shadow:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}

.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;margin-bottom:14px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg.sm button{font-size:13px;padding:7px 2px;letter-spacing:-.01em;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--c)}

/* calendário */
.cal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 10px 10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-h b{font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.cal-h div{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent,var(--c-agenda))}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-g .wd{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-g button{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.cal-g button.out{color:var(--muted);opacity:.45}
.cal-g button.today{color:var(--c-agenda);font-weight:800}
.cal-g button.sel{background:var(--c-agenda);color:var(--on-accent);font-weight:700}
.cal-g .dots{display:flex;gap:2px;height:5px}
.cal-g .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal-g button.sel .dots i{background:var(--on-accent)}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent,var(--c-agenda));color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20}
.fab svg{width:26px;height:26px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:-.01em;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--fg)}
.tabbar button.on svg{color:var(--tc)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,10,14,.42);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 8px;flex:none}
.sheet-h h3{font-family:var(--f-display);font-size:19px;margin:0;flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h button{color:var(--accent,var(--c-agenda));font-weight:600;min-width:64px;text-align:left;padding:6px 0}
.sheet-h .sp{min-width:64px}
.grab{width:38px;height:5px;border-radius:5px;background:var(--surface-2);margin:8px auto 0}
.sheet-b{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.fld > .lbl{font-size:13px;font-weight:600;color:var(--muted);padding-left:4px}
.inp{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:88px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{outline:none;border-color:var(--accent,var(--c-agenda))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:inline-block;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.radios input:checked + span{background:var(--accent,var(--c-agenda));border-color:transparent;color:var(--on-accent)}
.radios input:focus-visible + span{outline:2px solid var(--accent,var(--c-agenda));outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{flex:1;min-width:120px;padding:13px 16px;border-radius:14px;font-weight:700;background:var(--surface);box-shadow:var(--shadow);text-align:center}
.btn.primary{background:var(--accent,var(--c-agenda));color:var(--on-accent);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:var(--on-accent)}
.btn.sm{flex:none;min-width:0;padding:9px 14px;font-size:14px;border-radius:12px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0}
.inline-add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.inline-add .inp{padding:9px 12px;border-radius:10px}
.x{color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex:none}
.x svg{width:16px;height:16px}

.ex-row{display:grid;grid-template-columns:minmax(0,1fr) 52px 60px 64px 30px;gap:6px;align-items:center}
.ex-row .inp{padding:10px 8px;border-radius:10px;text-align:center}
.ex-row .inp:first-child{text-align:left}
.ex-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ex-head span:first-child{padding-left:4px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--c-reun) 13%,var(--surface));border-radius:16px;padding:12px 14px;margin-bottom:20px;font-size:14px}
.banner p{margin:0;flex:1 1 200px;min-width:0}
.banner .btn{flex:none;min-width:0;padding:9px 14px;font-size:14px}

.timer{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer .clock{font-family:var(--f-display);font-size:58px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.timer .ring{width:100%}
.timer .btns{width:100%;margin:0}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week i{width:34px;height:34px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-style:normal;color:var(--fg);font-size:14px}
.week i.on{background:var(--c-treino);color:var(--on-accent);box-shadow:none}
.week i.today{outline:2px solid var(--c-treino);outline-offset:2px}

.hgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.hgrid button{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.hgrid button.on{background:var(--c-habito);color:var(--on-accent)}
.ex-table{width:100%;border-collapse:collapse;font-size:14px}
.ex-table td{padding:6px 0;border-top:1px solid var(--line)}
.ex-row .ex-vid{grid-column:1/-1;text-align:left!important;font-size:13px;padding:8px 10px;margin-top:-2px}
.ex-more{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ex-more label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:6px 10px;border-radius:10px;white-space:nowrap}
.ex-more select{background:transparent;border:0;font:inherit;color:var(--fg)}
.ex-more .inp{flex:1;min-width:0;font-size:13px;padding:8px 10px;text-align:left!important}
.exlink{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.exlink svg{width:20px;height:20px;padding:5px;flex:none;border-radius:50%;background:#E62117;color:#fff}
.ex-table td+td{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px;white-space:nowrap}
.shelf-wrap{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 0 0;overflow:hidden}
.shelf-wrap + .shelf-wrap{margin-top:12px}
.shelf-t{display:flex;justify-content:space-between;padding:0 14px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.shelf{display:flex;align-items:flex-end;gap:5px;padding:4px 14px 0;overflow-x:auto;min-height:150px;border-bottom:12px solid var(--wood);scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.spine{flex:none;width:var(--w,40px);height:var(--h,140px);background:var(--c);color:var(--on-accent);border-radius:4px 4px 1px 1px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12px;font-weight:700;overflow:hidden;box-shadow:inset 3px 0 0 rgba(255,255,255,.18),inset -2px 0 0 rgba(0,0,0,.12)}
.spine span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-height:100%}
.spine small{font-weight:600;opacity:.8;font-size:10px}
.shelf .empty-sp{align-self:center;color:var(--muted);font-size:14px;padding-bottom:20px}
.cover{flex:none;width:44px;height:64px;border-radius:4px;background:var(--c) center/cover no-repeat;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
.cover-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.cover-grid .cv{aspect-ratio:2/3;width:100%;border-radius:6px;background:var(--c) center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:flex-end;padding:8px;color:var(--on-accent);font-weight:700;font-size:13px;line-height:1.15;overflow:hidden}
.cover-grid .cv.img{color:transparent}
.cover-grid .ct{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-grid .ca{font-size:12px;color:var(--muted);margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-top{display:flex;gap:14px;align-items:flex-start}
.book-top .cv{width:96px;aspect-ratio:2/3;border-radius:6px;background:var(--c) center/cover no-repeat;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.2);display:grid;place-items:center;color:var(--on-accent);font-size:12px;font-weight:700;text-align:center;padding:6px}
.logger{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.minibars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px;padding:10px 14px 0}
.minibars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted);font-weight:600}
.minibars i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--c-leitura);min-height:2px}
.minibars b{font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums}
.pg{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.pg-head{display:flex;gap:14px;align-items:flex-start}
.pg-title{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.props{display:grid;grid-template-columns:minmax(118px,40%) minmax(0,1fr);column-gap:12px}
.prop-k{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;padding:8px 0;min-width:0}
.prop-k svg{width:16px;height:16px;flex:none;opacity:.85}
.prop-v{font-size:14px;font-weight:600;padding:8px 0;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.prop-v.empty{color:var(--muted);font-weight:400}
.pbox{width:18px;height:18px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;flex:none}
.pbox svg{width:12px;height:12px;opacity:0;color:var(--on-accent)}
.pbox.on{background:var(--c-agenda);border-color:var(--c-agenda)}
.pbox.on svg{opacity:1}
.pg-rule{height:1px;background:var(--line);margin:2px 0}
.pg-sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.md{font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md h3,.md h4,.md h5{font-size:16px;font-weight:700;margin:16px 0 6px}
.md h3{font-family:var(--f-display);font-size:19px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-size:14px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.md a{color:var(--accent,var(--c-agenda))}
.md > :last-child{margin-bottom:0}
.ring{width:18px;height:18px;flex:none}
.ccard{border-radius:16px 16px 0 0;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wcard{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.wcard .cv{aspect-ratio:2/3;width:100%;border-radius:10px;background:var(--c) center/cover no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.05;overflow:hidden}
.wcard .cv.img{color:transparent}
.wcard .ct{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .ca{font-size:13px;color:var(--muted);margin-top:-6px}
.wnew{aspect-ratio:2/3;width:100%;border-radius:10px;border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);display:grid;place-items:center;color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:12px}
.chthumb{flex:none;width:46px;height:62px;border-radius:6px;background:var(--c) center/cover no-repeat;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px}
.chthumb.img{color:transparent}
.chcover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;display:block;background:#000}
.reading{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:18px;line-height:1.7}
.reading p{margin:0 0 14px}
.editor{min-height:55vh;font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:18px;line-height:1.65}
.wstat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wstat b{color:var(--fg);font-variant-numeric:tabular-nums}
.alert-row .dot{width:10px;height:10px}
.stars{color:var(--c-reun);letter-spacing:1px}
.note{font-size:13px;color:var(--muted);padding:8px 4px 0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--c)}
/* ===== Refinamento visual: limpo e profissional =====
   Cor = significado. Ações usam uma única cor (tinta); links usam um único azul;
   as cores das áreas ficam só nos marcadores (pontos, faixas, barras, ícone da aba). */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --fg:#16181D; --muted:#6B7180; --line:rgba(22,24,29,.08);
  --ink:#16181D; --on-ink:#FFFFFF; --tint:#2B5FD9;
  --c-agenda:#3B6BD6; --c-reun:#C2820F; --c-treino:#D4533F; --c-fin:#1C8F63; --c-estudo:#6E58CF; --c-tarefa:#14857F; --c-habito:#C9477A; --c-leitura:#9A6B40; --c-escrita:#45608A; --c-jogo:#8C7616;
  --shadow:none; --radius:14px;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#181B21; --surface-2:#252930; --fg:#ECEEF2; --muted:#9097A4; --line:rgba(236,238,242,.08);
  --ink:#ECEEF2; --on-ink:#0E1014; --tint:#8AA8F5; --shadow:none;
  --c-agenda:#6E95F2; --c-reun:#E9A23F; --c-treino:#F2735F; --c-fin:#3FC28E; --c-estudo:#9C82F2; --c-tarefa:#35B7B4; --c-habito:#EE6C9B; --c-leitura:#D9A06A; --c-escrita:#8FB0D8; --c-jogo:#D6BF4C;
}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#181B21; --surface-2:#252930; --fg:#ECEEF2; --muted:#9097A4; --line:rgba(236,238,242,.08);
  --ink:#ECEEF2; --on-ink:#0E1014; --tint:#8AA8F5; --shadow:none;
  --c-agenda:#6E95F2; --c-reun:#E9A23F; --c-treino:#F2735F; --c-fin:#3FC28E; --c-estudo:#9C82F2; --c-tarefa:#35B7B4; --c-habito:#EE6C9B; --c-leitura:#D9A06A; --c-escrita:#8FB0D8; --c-jogo:#D6BF4C;
}

/* superfícies: sem sombra, contorno discreto */
.group,.tile,.cal,.timer,.shelf-wrap{box-shadow:none;border:1px solid var(--line);border-radius:var(--radius)}
.chip,.pill-btn,.btn,.week i{box-shadow:none}
.chip,.pill-btn{border:1px solid var(--line)}
.btn{border:1px solid var(--line);border-radius:12px;font-weight:600}

/* tipografia: escala clara, sem caixa-alta */
.top h1{font-weight:700;font-size:32px;letter-spacing:-.025em}
.top .eyebrow{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
.blk-h h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
.tile .k{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-weight:650;letter-spacing:-.01em}
.tag{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;padding:1px 7px}
.ex-head,.shelf-t,.pg-sec-t{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.cal-g .wd{font-weight:600}
.timer .clock{font-weight:600;letter-spacing:-.03em}
.row .t{font-weight:550}

/* ações: uma cor só */
.fab{background:var(--ink);color:var(--on-ink);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:transparent}
.btn.primary[style*="--c"]{background:var(--ink)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:transparent}
.chip.hab.on{background:var(--c);color:#fff}
.radios input:checked + span{background:var(--ink);color:var(--on-ink)}
.radios span{font-weight:500}
.cal-g button.today{color:var(--tint)}
.cal-g button.sel{background:var(--ink);color:var(--on-ink)}

/* links e botões de texto: um azul só */
.back,.sheet-h button,.icon-btn,.md a{color:var(--tint)}
.blk-h a,.blk-h button.link:not([data-act="tl-clear"]){color:var(--tint)!important;font-weight:550}
:focus-visible{outline-color:var(--tint)}
.inp:focus{border-color:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 18%,transparent)}
.inp{border-radius:12px}

/* cartão de crédito: cor sólida, sem degradê */
.ccard{background:color-mix(in srgb,var(--c) 80%,#000)}

/* barra de abas */
.tabbar button{font-weight:500}
.tabbar button.on{font-weight:600}
.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jgrid button{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.jimg{display:block;width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line)}
.jd{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jfull{display:block;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}

/* ===== Visual 2026: cartões brancos, cabeçalho em degradê, cor do app escolhível =====
   Inspirado em quadros de tarefas: fundo frio, cartões com sombra suave, faixas coloridas por área,
   uma cor de marca (roxo por padrão) nos botões, abas ativas e no topo da tela Hoje. */
:root{
  --brand:#6A3FD8; --brand-2:#B03FC4; --brand-soft:rgba(106,63,216,.12); --on-brand:#FFFFFF;
  --bg:#EEF0F6; --surface:#FFFFFF; --surface-2:#E6E9F2; --fg:#1B1D2A; --muted:#6B6F84; --line:rgba(27,29,42,.08);
  --shadow:0 1px 2px rgba(27,29,42,.06),0 6px 18px rgba(27,29,42,.06); --radius:16px;
  --ink:var(--brand); --on-ink:var(--on-brand); --tint:var(--brand);
  --side:#1E1B2E; --side-fg:#C9C6DA;
}
:root[data-brand="azul"]{--brand:#2F6FE0;--brand-2:#2BA7E0;--brand-soft:rgba(47,111,224,.12)}
:root[data-brand="verde"]{--brand:#13897F;--brand-2:#3BB273;--brand-soft:rgba(19,137,127,.12)}
:root[data-brand="laranja"]{--brand:#E2632A;--brand-2:#F2A33A;--brand-soft:rgba(226,99,42,.13)}
:root[data-brand="rosa"]{--brand:#D23C78;--brand-2:#8E44D6;--brand-soft:rgba(210,60,120,.12)}
:root[data-brand="grafite"]{--brand:#2C3142;--brand-2:#5A6178;--brand-soft:rgba(44,49,66,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111219; --surface:#1B1C26; --surface-2:#262836; --fg:#ECECF3; --muted:#9A9DB2; --line:rgba(236,236,243,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4); --brand-soft:rgba(160,130,255,.16); --side:#0B0B12; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111219; --surface:#1B1C26; --surface-2:#262836; --fg:#ECECF3; --muted:#9A9DB2; --line:rgba(236,236,243,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4); --brand-soft:rgba(160,130,255,.16); --side:#0B0B12; color-scheme:dark;
}
body{background:var(--bg)}
.group,.tile,.cal,.timer,.shelf-wrap,.logger{border:0;border-radius:var(--radius);box-shadow:var(--shadow)}
.top h1{font-weight:750;letter-spacing:-.03em}
.blk-h h2{font-weight:700}
.blk-h a,.blk-h button.link:not([data-act="tl-clear"]){color:var(--brand)!important}
.back,.sheet-h button,.icon-btn,.md a{color:var(--brand)}
.cal-g button.today{color:var(--brand)}
.cal-g button.sel{background:var(--brand);color:var(--on-brand)}
.inp{border:1px solid var(--line);background:var(--surface)}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
:focus-visible{outline-color:var(--brand)}
/* ações */
.btn{border:0;box-shadow:var(--shadow);background:var(--surface)}
.btn.primary,.btn.primary[style*="--c"]{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);box-shadow:0 6px 16px var(--brand-soft)}
.fab{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);box-shadow:0 10px 24px var(--brand-soft),0 4px 10px rgba(0,0,0,.18)}
.chip{border:0;box-shadow:var(--shadow)}
.chip.on{background:var(--brand);color:var(--on-brand)}
.chip.hab.on{background:var(--c);color:#fff}
.radios input:checked + span{background:var(--brand);color:var(--on-brand);border-color:transparent}
/* abas internas: pílulas com a ativa preenchida */
.seg{background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:4px}
.seg button{border-radius:10px}
.seg button.on{background:var(--brand);color:var(--on-brand);box-shadow:none}
/* listas com faixa colorida no topo, como colunas de um quadro */
.blk > .group:has(.row){position:relative;padding-top:4px}
.blk > .group:has(.row)::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--brand)}
.row .check.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--brand)) 20%,transparent)}
.tag{border-radius:999px;padding:2px 9px}
/* barra de abas */
.tabbar{background:var(--surface);border-top:0;box-shadow:0 -6px 20px rgba(27,29,42,.06);-webkit-backdrop-filter:none;backdrop-filter:none}
.tabbar button{color:var(--muted);border-radius:12px;padding:6px 0}
.tabbar button svg{padding:3px 10px;width:42px;height:28px;border-radius:999px;transition:background .15s}
.tabbar button.on{color:var(--brand)}
.tabbar button.on svg{color:var(--brand);background:var(--brand-soft)}
/* tela Hoje: topo em degradê com visão geral */
.hero{margin:-12px -16px 22px;padding:14px 16px 18px;background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);border-radius:0 0 26px 26px;color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero .top{margin-bottom:14px;position:relative;z-index:1}
.hero .top h1,.hero .top .eyebrow{color:#fff}
.hero .top .eyebrow{opacity:.85}
.hero .icon-btn{color:#fff!important;background:rgba(255,255,255,.16)}
.hero .ov{position:relative;z-index:1;background:var(--surface);color:var(--fg);border-radius:18px;box-shadow:0 10px 28px rgba(20,10,60,.22);padding:12px 12px 10px}
.hero .ov-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin:0 4px 8px}
.hero .ov-h span{font-size:12px;color:var(--muted);font-weight:500}
.hero .tiles{gap:8px}
.hero .tile{box-shadow:none;background:var(--surface-2);border-radius:14px;display:flex;flex-direction:column;gap:6px;padding:10px}
.hero .tile .k{order:2;font-size:12px}
.hero .tile .v{order:1;display:flex;align-items:center;gap:8px;margin:0;font-size:22px;color:var(--fg)}
.hero .tile .v::before{content:"";width:22px;height:22px;border-radius:50%;flex:none;border:4px solid var(--c);box-sizing:border-box}
.hero .tile .v.sm{font-size:clamp(12px,3.6vw,16px);padding:0;gap:6px;letter-spacing:-.02em}
.hero .tile .v.sm::before{width:16px;height:16px;border-width:3px}
.hero .banner{color:var(--fg)}
/* folhas e páginas */
.sheet{background:var(--bg)}
.pbox.on{background:var(--brand);border-color:var(--brand)}
.toast{background:var(--fg);color:var(--bg)}
/* tela grande: barra lateral escura */
@media (min-width:900px){
  .tabbar{top:0;bottom:0;right:auto;width:220px;padding:22px 12px;background:var(--side);box-shadow:none;border:0}
  .tabbar::before{content:"Rotina";display:block;color:#fff;font-weight:800;font-size:22px;letter-spacing:-.02em;padding:0 12px 20px}
  .tabbar nav{display:flex;flex-direction:column;gap:4px;max-width:none}
  .tabbar button{flex-direction:row;gap:12px;font-size:15px;color:var(--side-fg);padding:10px 12px;justify-content:flex-start}
  .tabbar button svg{width:22px;height:22px;padding:0;background:none!important}
  .tabbar button span{overflow:visible}
  .tabbar button.on{background:rgba(255,255,255,.1);color:#fff}
  .tabbar button.on svg{color:var(--brand-2)}
  #app{max-width:780px;margin-left:calc(220px + max(24px,(100vw - 220px - 780px)/2));padding-bottom:60px}
  .fab{right:max(32px,calc((100vw - 220px - 780px)/2 - 20px));bottom:32px}
  .sheet{left:220px}
  .hero{margin:-12px 0 22px;border-radius:0 0 26px 26px}
}

/* calendário com topo colorido */
.hero.ag{background:none;overflow:visible;padding-bottom:0}
.hero.ag::before{content:"";position:absolute;inset:0 0 auto;height:calc(100% - 150px);min-height:190px;background:linear-gradient(140deg,var(--brand),var(--brand-2));border-radius:0 0 26px 26px}
.hero.ag::after{display:none}
.hero.ag > *{position:relative;z-index:1}
.hero .seg{background:rgba(255,255,255,.16);box-shadow:none}
.hero .seg button{color:rgba(255,255,255,.88)}
.hero .seg button.on{background:#fff;color:var(--brand)}
.hero .pill-btn{background:rgba(255,255,255,.2);color:#fff;border:0;box-shadow:none}
.hero .cal{color:var(--fg);box-shadow:0 12px 30px rgba(20,10,60,.18);padding:14px 12px 12px}
.hero .cal-h b{font-size:19px}
.cal-g button{border-radius:50%;font-weight:500}
.cal-g button.today{background:var(--brand-soft);color:var(--brand);font-weight:800}
.cal-g button.sel{background:transparent;color:var(--brand);font-weight:800;box-shadow:inset 0 0 0 2px var(--brand)}
.cal-g button.sel .dots i{background:var(--c)}
.cal-g button.today.sel{background:var(--brand);color:var(--on-brand);box-shadow:none}
.cal-g button.today.sel .dots i{background:var(--on-brand)}
.hero .cal .icon-btn{color:var(--brand)!important;background:var(--surface-2)}
.hero .cal-h div{gap:8px}
.evlist{display:flex;flex-direction:column;gap:10px}
.evcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 12px 12px 16px;position:relative;overflow:hidden}
.evcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.evcard .main{flex:1;min-width:0}
.evcard .t{font-weight:650;overflow-wrap:anywhere}
.evcard .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.evcard.done .t{text-decoration:line-through;color:var(--muted)}
.evdate{flex:none;width:48px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.evdate b{font-size:19px;font-weight:800}
.evdate span{font-size:11px;font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}

/* gráfico anual de gastos: 8 cores fixas por categoria (validadas para daltonismo) + cinza para Outros */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s0:#9A9CA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s0:#6E7082}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s0:#6E7082}
.ychart svg path[data-tip]{cursor:pointer;transition:opacity .12s}
.ychart svg:hover path[data-tip]{opacity:.55}
.ychart svg path[data-tip]:hover,.ychart svg path.hl{opacity:1}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 18px;margin:12px 4px 0}
@media (min-width:600px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:13px;min-width:0}
.lg i{width:12px;height:12px;border-radius:4px}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-weight:650;font-size:12px}
.lg em{font-style:normal;color:var(--muted);font-size:11px;min-width:28px;text-align:right}
.ctip{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:7px 10px;border-radius:10px;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* cabeçalho em degradê em todas as telas */
.hero.band{padding-bottom:16px;margin-bottom:20px}
.hero.band .top{margin-bottom:12px}
.hero.band .top:last-child{margin-bottom:0}
.hero.band .seg{margin-bottom:0}
.hero .back{color:#fff}
.hero .pill-btn{color:#fff!important;background:rgba(255,255,255,.2)!important;border:0}
.hero .top .eyebrow{color:#fff}

/* blocos dentro da faixa colorida */
.hero.band .in-band{margin:16px 0 0}
.hero .blk-h h2{color:#fff}
.hero .blk-h span,.hero .blk-h .link{color:rgba(255,255,255,.85)!important}
.hero .week div{color:rgba(255,255,255,.85)}
.hero .week i{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.hero .week i.on{background:#fff;color:var(--c-treino)}
.hero .week i.today{outline-color:#fff}
.hero.band .cal-h b{color:#fff}
.hero.band .tile{background:var(--surface);box-shadow:0 8px 22px rgba(20,10,60,.16);color:var(--fg)}
.hero.band .tiles{gap:8px}
.hero .group{color:var(--fg)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.swatch i{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:var(--shadow);display:grid;place-items:center;color:#fff}
.swatch i svg{width:20px;height:20px;opacity:0}
.swatch.on{color:var(--fg)}
.swatch.on i{outline:3px solid var(--fg);outline-offset:2px}
.swatch.on i svg{opacity:1}

/* gamificação */
.player{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.16);border-radius:18px;padding:8px 14px 8px 8px;margin:0 0 12px;color:#fff}
.avbox{display:grid;place-items:end center;flex:none;background:var(--av);border-radius:14px;padding:4px 6px 2px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.avbox.big{border-radius:24px;padding:10px 18px 6px}
.pxav{display:block}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl-top b{font-size:17px;font-weight:750}
.pl-top span{font-size:12px;opacity:.85;font-weight:600}
.pl-sub{display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.9;font-weight:600}
.xpbar{display:block;height:8px;border-radius:8px;background:rgba(255,255,255,.28);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#FFE27A,#FFB547)}
.xpbar.lg{height:12px;margin-top:8px}
.prof{display:flex;gap:16px;align-items:center;color:#fff}
.prof-main{flex:1;min-width:0}
.prof-name{font-size:22px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof-t{font-size:14px;font-weight:600;opacity:.9}
.prof-xp{font-size:12px;opacity:.85;margin-top:4px;font-weight:600}
.prof .btn{background:#fff;color:var(--brand);flex:none}
.achs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.ach-i{font-size:28px;line-height:1.1;filter:grayscale(1);opacity:.45}
.ach b{font-size:12px;font-weight:700;line-height:1.2}
.ach small{font-size:11px;color:var(--muted);line-height:1.25}
.ach:not(.on) b{color:var(--muted)}
.ach.on{box-shadow:var(--shadow),inset 0 0 0 2px var(--brand-soft)}
.ach.on .ach-i{filter:none;opacity:1}
.flame{flex:none;font-size:13px;font-weight:800;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,#FF8A3D 16%,var(--surface));color:#D9561B;white-space:nowrap}
.flame.hot{background:linear-gradient(135deg,#FF8A3D,#FF4D6D);color:#fff}
.boss{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.boss-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px}
.boss-h b{color:var(--c-fin)}
.hp{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#E34948,#FF7A59);border-radius:6px;transition:width .3s}
.hp s{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.avprev{display:grid;place-items:center;background:var(--av);border-radius:20px;padding:14px 0 8px;margin:4px 0 12px}
.avsw-row{display:flex;flex-wrap:wrap;gap:8px}
.avsw{width:34px;height:34px;border-radius:10px;background:var(--a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.avsw.on{outline:3px solid var(--brand);outline-offset:2px}
.avthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.avth{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.avth span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avth.on{outline:2px solid var(--brand);color:var(--fg)}
.avchip{padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.avchip.on{background:var(--brand);color:var(--on-brand);border-color:transparent}

/* cabeçalho com avatar */
.top.hx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding-top:4px}
.hx-av{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;min-width:0}
.hx-date{font-size:12px;font-weight:600;opacity:.92;white-space:nowrap;text-align:center}
.hx-card{display:grid;place-items:end center;background:var(--av);border-radius:16px;padding:8px 8px 4px;box-shadow:0 10px 24px rgba(20,10,60,.24),inset 0 -8px 0 rgba(0,0,0,.06)}
.hx-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.hx-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top.hx h1{font-size:28px;overflow-wrap:anywhere}
.top.hx .eyebrow{font-size:13px}
.hx-xpwrap{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;color:#fff}
.hx-xp{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;opacity:.92}
.hx .xpbar{height:10px}
.hx-ch{font-size:12px;font-weight:600;opacity:.9}
.hero.hx-hoje{overflow:visible;margin-bottom:22px;padding-bottom:16px}
.hero.hx-hoje::after{display:none}
.hx.big{margin-bottom:0}
.hx.big .hx-av{align-self:center}
.hx.big .hx-card{padding:8px 8px 8px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.hx-lv{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.72);color:#FFE27A;padding:3px 8px;border-radius:999px}
.hx.big .ov{margin-top:6px}
.hx.big .tiles{gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.hx.big .tile:last-child{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
.hx.big .tile:last-child .k{order:2}
.hx.big .tile{padding:8px 7px}
.hx.big .tile .v{font-size:19px;gap:6px}
.hx.big .tile .v::before{width:16px;height:16px;border-width:3px}
.hx.big .tile .v.sm{font-size:16px}
@media (min-width:600px){.top.hx h1{font-size:32px}}
.xpb{display:inline-flex;align-items:center;flex:none;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,#F2A33A 18%,var(--surface));color:#B5650C;white-space:nowrap;letter-spacing:.01em}
.row .xpb{margin-left:4px}

/* Hoje: saudação em cima, painel do jogador e visão geral em largura total */
.hh-top{margin-bottom:12px}
.hh-top .icon-btn{color:#fff!important;background:rgba(255,255,255,.16)}
.hh-player{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:#fff;background:rgba(255,255,255,.14);border-radius:20px;padding:10px 14px 10px 10px;margin-bottom:12px}
.hh-av{flex:none;display:grid;place-items:end center;background:var(--av);border-radius:16px;padding:6px 10px 4px;box-shadow:0 8px 20px rgba(20,10,60,.22),inset 0 -6px 0 rgba(0,0,0,.06)}
.hh-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.hh-lv{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hh-lv b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hh-lv span{font-size:12px;font-weight:700;background:rgba(0,0,0,.22);padding:2px 8px;border-radius:999px;white-space:nowrap}
.hh-info .xpbar{height:12px}
.hh-xp{font-size:12px;font-weight:600;opacity:.92}
.hh-chips{display:flex;flex-wrap:wrap;gap:6px}
.hh-chip{font-size:12px;font-weight:700;background:#fff;color:#1B1D2A;padding:4px 9px;border-radius:999px}
.hero.hx-hoje .ov{margin-top:0}

.gradpick{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.gp-prev{height:64px;border-radius:14px;display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.gp-c{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px;cursor:pointer;min-width:0}
.gp-c input{width:36px;height:36px;border:0;padding:0;border-radius:10px;background:none;flex:none;cursor:pointer}
.gp-c input::-webkit-color-swatch-wrapper{padding:0}.gp-c input::-webkit-color-swatch{border:0;border-radius:10px}
.gp-c span{display:flex;flex-direction:column;min-width:0;font-size:13px}.gp-c small{color:var(--muted);font-size:12px}
.gp-presets{display:flex;flex-wrap:wrap;gap:8px}
.gp-pre{width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow)}

/* ranking, títulos e aparências */
.rank{align-items:center}
.rk-pos{width:28px;flex:none;font-weight:800;color:var(--muted);font-size:14px}
.rk-ic{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c,var(--brand)) 14%,var(--surface))}
.titles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ttl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;min-width:0}
.ttl span{font-size:20px}.ttl b{font-size:13px;font-weight:700}.ttl small{font-size:11px;color:var(--muted);line-height:1.25}
.ttl.on{outline:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.ttl.lock{opacity:.55}.ttl.lock span{filter:grayscale(1)}
.avth.lock{opacity:.55}.avth.lock svg{filter:grayscale(.8)}
.avth small{font-size:10px;color:var(--muted);line-height:1.2;text-align:center}
.avsw.lock{opacity:.45;display:grid;place-items:center;font-size:13px}

/* moedas, missões e loja */
.coinpill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,#E8A13A 18%,var(--surface));color:#A0600A;white-space:nowrap}
.coinpill.sm{font-size:12px;padding:2px 8px;flex:none}
.hh-chip.coin{background:#FFE9B8;color:#7A4A06}
.mission.done .t{text-decoration:line-through;color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pack{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 12px;text-align:center;min-width:0}
.pack-av{display:grid;place-items:end center;width:100%;background:var(--av);border-radius:12px;padding:8px 0 4px}
.pack b{font-size:14px;font-weight:700}.pack small{font-size:11px;color:var(--muted)}
.pack .btn{width:100%;margin-top:2px}
.pack.own{outline:2px solid color-mix(in srgb,var(--c-fin) 60%,transparent)}
/* ---------- Treinos (estilo rotina → detalhe → treino em andamento) ---------- */
.wk-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk-qb{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:15px;color:var(--fg)}
.wk-qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.wk-qi svg{width:20px;height:20px}
.wk-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.wk-ct{display:flex;align-items:flex-start;gap:6px}
.wk-open{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;text-align:left;color:var(--fg)}
.wk-open h3{font-size:17px;font-weight:700;line-height:1.3;margin:0}
.wk-sum{color:var(--muted);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wk-meta{font-size:12.5px;color:var(--muted)}
.wk-more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none;margin:-6px -6px 0 0}
.wk-more svg{width:20px;height:20px}
.wk-go{width:100%;flex:none}
.wk-resume{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin:0 0 22px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--c-treino);color:var(--fg)}
.wk-resume b{display:block;font-size:15px}.wk-resume small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.wk-resgo{font-weight:700;color:var(--c-treino);font-size:15px}
.wk-pulse{width:12px;height:12px;border-radius:50%;background:var(--c-treino);flex:none;animation:wkp 1.4s ease-in-out infinite}
@keyframes wkp{0%,100%{opacity:1}50%{opacity:.3}}
.wk-info{font-size:14px;opacity:.9;margin:0 0 12px}
.wk-big{width:100%;background:#fff!important;color:var(--brand)!important;font-size:16px;padding:14px;box-shadow:0 8px 20px rgba(20,10,60,.18)!important}
.wk-chart{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px 14px 12px;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end}
.wk-nodata{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);text-align:center;padding:10px 0}
.wk-nodata svg{width:52px;height:52px;opacity:.6}.wk-nodata span{font-size:15px}.wk-nodata small{font-size:12.5px;opacity:.85}
.wk-bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.wk-bars div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.wk-bars b{font-size:11px;font-variant-numeric:tabular-nums}
.wk-bars i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--brand),var(--brand-2,var(--brand)))}
.wk-bars small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.wk-exd{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.wk-exh{display:flex;align-items:center;gap:8px;padding:14px 14px 4px}
.wk-exh .exlink{flex:1;min-width:0;font-size:17px;font-weight:700;color:var(--brand)}
.wk-exh .exlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-pr{font-size:12px;font-weight:700;color:#A0600A;background:#FBEEDC;padding:3px 8px;border-radius:999px;flex:none}
.wk-rest{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;padding:4px 14px 8px}
.wk-rest svg{width:18px;height:18px}
.wk-tbl{font-size:15px;padding-bottom:6px}
.wk-tr{display:grid;grid-template-columns:64px 1fr 1.7fr;align-items:center}
.wk-tr span{padding:10px 14px;font-variant-numeric:tabular-nums}
.wk-tr:nth-child(odd):not(.h){background:var(--surface-2)}
.wk-tr.h span{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:4px;padding-bottom:6px}
.wk-w{color:#D99A00;font-weight:800}
.wk-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;margin:-12px -16px 0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.wk-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--fg);flex:none}
.wk-ic svg{width:22px;height:22px}
.wk-tt{flex:1;min-width:0;display:flex;flex-direction:column}
.wk-tt b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wk-tt small{font-size:12px;color:var(--muted)}
.wk-finish{flex:none;min-width:0;padding:10px 18px;border-radius:12px}
.wk-pick{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-top:12px}
.wk-pick>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 2px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.wk-stats span{display:block;font-size:12.5px;color:var(--muted)}
.wk-stats b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.wk-stats b.acc{color:var(--c-treino)}
.wk-ex{padding:8px 0 18px;border-bottom:1px solid var(--line)}
.wk-ex .wk-exh{padding:8px 0 6px}
.wk-chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.wk-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--fg)}
.wk-chip svg{width:17px;height:17px}
.wk-chip select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:inherit;padding:0;cursor:pointer}
.wk-note{width:100%;margin:0 0 10px;font-size:14px;resize:vertical}
.wk-grid{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 72px 44px;gap:6px;align-items:center}
.wk-gh{font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:0 0 6px}
.wk-gh span:nth-child(n+3){text-align:center}
.wk-gh svg{width:18px;height:18px;display:block;margin:0 auto}
.wk-set{padding:4px 0;border-radius:10px;transition:background .15s}
.wk-set.done{background:color-mix(in srgb,var(--c-fin) 16%,transparent)}
.wk-n{height:40px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:15px;color:var(--fg)}
.wk-n.w{color:#D99A00}
.wk-set.done .wk-n{background:transparent}
.wk-prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.wk-set .inp{height:40px;padding:6px;text-align:center;border-radius:10px;font-size:16px;font-variant-numeric:tabular-nums;min-width:0;width:100%}
.wk-set.done .inp{background:transparent;border-color:transparent;font-weight:700}
.wk-ck{width:40px;height:40px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;justify-self:center}
.wk-ck svg{width:20px;height:20px}
.wk-set.done .wk-ck{background:var(--c-fin);color:#fff}
.wk-setbtns{display:flex;gap:8px;margin-top:10px}
.wk-add{flex:1;padding:12px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:15px;color:var(--fg)}
.wk-add.sm{flex:none;padding:12px 14px;color:var(--muted)}
.wk-addex{display:flex;gap:8px;margin:18px 0 10px}
.wk-addex .inp{flex:1;min-width:0}
.wk-addex .btn{flex:none;min-width:0}

const CAT_SLOT = { Moradia: 1, Mercado: 2, Transporte: 3, 'Saúde': 4, 'Educação': 5, Lazer: 6, Contas: 7, 'Cartão': 8 };

  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= v); };
  const step = nice(Math.max(...sums) / 4), top = step * Math.ceil(Math.max(...sums) / step);
  const W = 360, H = 135, L = 34, R = 4, T = 16, B = 20, bw = (W - L - R) / 12, gap = Math.max(4, bw * .22), yb = H - B, sc = v => v / top * (yb - T);
  const kfmt = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: v >= 10000 ? 0 : 1 }) + ' mil' : Math.round(v).toLocaleString('pt-BR');
  let bars = months.map((m, i) => `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${yb - T + B}" fill="transparent" data-act="fin-goto" data-m="${y}-${pad(i + 1)}" aria-label="Abrir ${MES[i]}" style="cursor:pointer"/>`).join('');

    segs.forEach((c, j) => { const h = sc(m[c]); const last = j === segs.length - 1; const hh = Math.max(1, h - (last ? 0 : 2)); const yTop = yy - h;
      const r = last ? Math.min(4, hh / 2) : 0;
      const d = r ? `M${x},${yTop + h} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yTop + h} Z` : `M${x},${yy} V${yy - hh} H${x + w} V${yy} Z`;

    <div class="lgrid">${legend}</div>
    <p class="note" style="padding:6px 2px 0">Saídas lançadas e compras no cartão (cada parcela no mês em que a fatura vence). Toque numa cor para ver o valor e num mês para abri-lo.</p></div></section>`;

// séries-alvo de um exercício da rotina (aquecimento opcional + séries de trabalho)
function wkTargets(e) {
  const out = [], w = String(e.warm || '').match(/^\s*([\d.,]+)\s*(?:kg)?\s*[x×]\s*([\d]+(?:\s*[-–]\s*\d+)?)/i);
  if (w) out.push({ w: 1, tkg: w[1].replace(',', '.'), treps: w[2].replace(/\s/g, '') });
  const n = Math.max(1, Math.min(20, parseInt(e.sets) || 1)), kg = wkNum(e.load);
  for (let i = 0; i < n; i++) out.push({ w: 0, tkg: kg ? String(kg) : '', treps: String(e.reps || '') });
  return out;
}
// séries feitas na última vez que o exercício apareceu num treino registrado
function wkPrev(exId) {
  const logs = S.workouts.log.filter(l => Array.isArray(l.ex) && l.ex.some(x => x.exId === exId)).sort((a, b) => (b.date + (b.end || '')).localeCompare(a.date + (a.end || '')));
  const x = logs[0] && logs[0].ex.find(x => x.exId === exId); return x ? x.sets : [];
}
const wkRepsNum = r => { const m = String(r || '').match(/\d+/g); return m ? +m[m.length - 1] : 0; };
function wkStats(a) {
  let vol = 0, sets = 0;
  a.ex.forEach(x => x.sets.forEach(s => { if (!s.done) return; sets++; vol += wkNum(s.kg || s.tkg) * wkRepsNum(s.reps || s.treps); }));
  return { vol: Math.round(vol), sets };
}
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}h ${pad(m)}min` : m ? `${m}min ${s % 60}s` : `${s}s`; };
const fmtKg = v => `${Math.round(v).toLocaleString('pt-BR')} kg`;

/* ---------- busca ---------- */
const norm = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function searchAll(q) {
  const n = norm(q); if (n.length < 2) return [];
  const hit = (...xs) => xs.some(x => norm(x).includes(n));
  const snip = (txt) => { const t = String(txt || ''); const i = norm(t).indexOf(n); if (i < 0) return ''; const a = Math.max(0, i - 30); return (a ? '…' : '') + t.slice(a, i + n.length + 50).replace(/\s+/g, ' ') + '…'; };
  const r = [];
  S.events.forEach(e => { if (hit(e.title, e.notes)) r.push(['Agenda', 'evento', e.id, e.title, `${fmtDay(e.date)}${hit(e.title) ? '' : ' · ' + snip(e.notes)}`, EV_CATS[e.cat]?.[1]]); });
  S.meetings.forEach(m => { if (hit(m.title, m.notes, m.people, ...m.agenda.map(a => a.text), ...m.actions.map(a => a.text))) r.push(['Reuniões', 'reuniao', m.id, m.title, fmtDay(m.date), 'var(--c-reun)']); });
  S.tasks.forEach(t => { if (hit(t.title, t.notes)) r.push(['Tarefas', 'tarefa', t.id, t.title, t.done ? 'Concluída' : (t.due ? fmtDay(t.due) : 'Sem prazo'), 'var(--c-tarefa)']); });
  (S.career?.tasks || []).forEach(t => { if (hit(t.title, t.deliv, t.learn)) r.push(['Carreira', 'carreira', t.id, t.title, `Semana ${t.w} · ${t.status}`, 'var(--c-estudo)']); });
  S.books.forEach(b => { if (hit(b.title, b.author, b.desc, b.summary, b.quotes, curLoan(b)?.to)) r.push(['Livros', 'livro', b.id, b.title, b.author || '', 'var(--c-leitura)']); });
  S.writing.projects.forEach(p => { if (hit(p.title, p.synopsis)) r.push(['Escritor', 'w-proj', p.id, p.title, `${p.chapters.length} capítulos`, 'var(--c-escrita)']); p.chapters.forEach(c => { const tx = S.writing.texts[c.id]; if (hit(c.title, tx, c.notes)) r.push(['Escritor', 'capitulo', c.id, `${p.title} · Cap. ${c.n} ${c.title || ''}`, hit(c.title) ? `${fmtN(c.words || 0)} palavras` : snip(tx || c.notes), 'var(--c-escrita)']); }); });
  S.games.forEach(g => { const l = curLoan(g); if (hit(g.name, g.desc, g.cat, l && l.to)) r.push(['Jogos', 'jogo', g.id, g.name, l ? 'Emprestado para ' + l.to : g.cat, 'var(--c-jogo)']); });
  S.finance.tx.forEach(t => { if (hit(t.desc, t.cat)) r.push(['Finanças', 'lancamento', t.id, t.desc || t.cat, `${fmtDay(t.date)} · ${t.type === 'in' ? '+' : '−'} ${money(t.amount)}`, 'var(--c-fin)']); });
  S.finance.purchases.forEach(p => { if (hit(p.desc, p.cat)) r.push(['Finanças', 'compra', p.id, p.desc, `${fmtDay(p.date)} · ${money(p.amount)}`, 'var(--c-fin)']); });
  return r.slice(0, 60);
}

function alertsCard() {
  const t = today(), in3 = iso(addDays(new Date(), 3)), out = [];
  const late = S.tasks.filter(x => !x.done && x.due && x.due < t).length; if (late) out.push([`${late} ${late === 1 ? 'tarefa atrasada' : 'tarefas atrasadas'}`, 'Ver tarefas', 'sub', 'tarefas', 'var(--danger)']);
  const bills = [...S.finance.tx.filter(x => x.type === 'out' && !x.paid && x.date <= in3).map(x => ({ d: x.date, v: x.amount, n: x.desc || x.cat })), ...S.finance.cards.flatMap(c => invoices(c).filter(v => !v.paid && v.total > 0 && v.state !== 'Futura' && v.due <= in3).map(v => ({ d: v.due, v: v.total, n: 'Fatura ' + c.name })))];
  if (bills.length) { const over = bills.filter(b => b.d < t).length; out.push([`${bills.length} ${bills.length === 1 ? 'conta' : 'contas'} ${over ? `(${over} vencida${over > 1 ? 's' : ''})` : 'vencendo em até 3 dias'} · ${money(bills.reduce((a, b) => a + b.v, 0))}`, 'Abrir finanças', 'tab', 'financas', over ? 'var(--danger)' : 'var(--c-reun)']); }
  const mt = monthTotals(t.slice(0, 7)); if (S.finance.budget && mt.out >= S.finance.budget * 0.8) out.push([`Meta de gastos em ${Math.round(mt.out / S.finance.budget * 100)}%`, 'Ver meta', 'tab', 'financas', mt.out > S.finance.budget ? 'var(--danger)' : 'var(--c-reun)']);
  const w = careerWeek(); const cl = (S.career?.tasks || []).filter(x => x.status === 'A fazer' && x.w < w && x.prazo < t).length; if (cl) out.push([`${cl} ${cl === 1 ? 'tarefa' : 'tarefas'} de carreira ficaram para trás`, 'Ver programa', 'sub', 'carreira', 'var(--c-estudo)']);
  const longLoans = [...S.books, ...S.games].filter(x => { const l = curLoan(x); return l && (l.due ? l.due < t : daysSince(l.date) > 30); }); if (longLoans.length) out.push([`${longLoans.length} ${longLoans.length === 1 ? 'item emprestado' : 'itens emprestados'} há muito tempo`, 'Ver', 'tab', 'jogos', 'var(--c-jogo)']);
  const mNoAgenda = S.meetings.filter(m => m.status !== 'realizada' && m.date >= t && m.date <= iso(addDays(new Date(), 1)) && !m.agenda.length); mNoAgenda.forEach(m => out.push([`Reunião “${m.title}” ${m.date === t ? 'hoje' : 'amanhã'} ainda sem pauta`, 'Montar pauta', 'open-meeting', m.id, 'var(--c-reun)']));
  if (!out.length) return '';
  return `<section class="blk"><div class="blk-h"><h2>Atenção</h2></div><div class="group">${out.map(([txt, lab, act, k, c]) => `<button class="row alert-row" data-act="${act}" data-k="${k}" data-id="${k}"><span class="dot" style="--c:${c}"></span><div class="main"><div class="t" style="font-weight:600">${esc(txt)}</div></div><span class="end" style="color:${c};font-weight:600;font-size:13px">${lab}</span></button>`).join('')}</div></section>`;
}

function fieldHtml(f, v) {
  const id = `f-${f.k}`;
  const val = v ?? f.def ?? '';
  const lab = `<label for="${id}">${f.l}</label>`;
  switch (f.t) {
    case 'textarea': return `<div class="fld">${lab}<textarea class="inp" id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea></div>`;
    case 'select': return `<div class="fld">${lab}<select class="inp" id="${id}" name="${f.k}">${f.o.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(val) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;
    case 'radio': return `<div class="fld"><span class="lbl">${f.l}</span><div class="radios" role="radiogroup">${f.o.map((o, i) => `<label><input type="radio" id="${id}-${i}" name="${f.k}" value="${esc(o[0])}" ${String(o[0]) === String(val) ? 'checked' : ''}><span>${esc(o[1])}</span></label>`).join('')}</div></div>`;
    case 'days': return `<div class="fld"><span class="lbl">${f.l}</span><div class="radios">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label><input type="checkbox" id="${id}-${d}" name="${f.k}" value="${d}" ${(val || []).includes(d) ? 'checked' : ''}><span>${WD[d]}</span></label>`).join('')}</div></div>`;
    case 'check': return `<label class="row group" for="${id}" style="cursor:pointer"><input type="checkbox" id="${id}" name="${f.k}" ${val ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--accent)"><span class="main">${f.l}</span></label>`;
    case 'money': return `<div class="fld">${lab}<input class="inp num" id="${id}" name="${f.k}" inputmode="decimal" placeholder="0,00" value="${val === '' ? '' : String(val).replace('.', ',')}"></div>`;
    case 'number': return `<div class="fld">${lab}<input class="inp num" id="${id}" name="${f.k}" type="number" inputmode="decimal" min="0" step="any" value="${esc(val)}" placeholder="${esc(f.ph || '')}"></div>`;
    default: return `<div class="fld">${lab}<input class="inp" id="${id}" name="${f.k}" type="${f.t || 'text'}" value="${esc(val)}" placeholder="${esc(f.ph || '')}" ${f.t === 'text' || !f.t ? 'autocomplete="off"' : ''}></div>`;
  }
}
function rowsHtml(fields, data) {
  const out = []; let i = 0;
  while (i < fields.length) {
    const f = fields[i];
    if (f.half && fields[i + 1]?.half) { out.push(`<div class="two">${fieldHtml(f, data[f.k])}${fieldHtml(fields[i + 1], data[fields[i + 1].k])}</div>`); i += 2; }
    else { out.push(fieldHtml(f, data[f.k])); i++; }

}
function readForm(form, fields) {
  const o = {};
  fields.forEach(f => {
    if (f.t === 'days') o[f.k] = $$(`[name="${f.k}"]:checked`, form).map(x => +x.value);
    else if (f.t === 'check') o[f.k] = form.elements[f.k].checked;

}
function openForm({ title, fields, data = {}, onSave, onDelete, color, extra = '', top = '' }) {

    r.onload = () => { const ta = $('#f-notes'); const txt = String(r.result); ta.value = ta.value.trim() ? ta.value.trimEnd() + '\n\n— ' + f.name + ' —\n' + txt : txt; ta.dispatchEvent(new Event('input')); $('#att-info').textContent = `${f.name} anexado · ${txt.length.toLocaleString('pt-BR')} caracteres`; };
    r.onerror = () => toast('Não consegui ler esse arquivo. Use .txt ou .md.'); r.readAsText(f); t.value = '';
  }
  if (t.id === 'cover-file' && t.files[0]) { setCover(t.files[0]); t.value = ''; }
  if (t.id === 'journal-file' && t.files.length) { addJournal(t.files); t.value = ''; }
  if (t.id === 'import-file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result); const st = j.state || j; const base = emptyState();
        if (typeof st !== 'object' || !st.events) throw 0;
        MODULES.forEach(m => S[m] = st[m] ?? base[m]); ensureCareer(); ensureFinance(); S.meta.demo = false; normalize();
        journalToIdb().then(() => { persist(...MODULES); toast('Backup importado'); render(); });
      } catch (err) { toast('Arquivo inválido. Escolha um backup .json do Rotina.'); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});
function resizeImg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => rej(new Error('img')); img.src = url;
  });
}
async function setCover(file) {
  const sh = $('#sheet'), pv = $('#cover-prev');
  try {
    let url = null;
    const assets = (store.db && window.claude?.use) ? await window.claude.use('assets') : null;
    if (assets) {
      const c = await resizeImg(file, 720);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      try { const a = await assets.upload(blob); url = a.url; } catch (e) { url = null; }
    }
    if (!url) { const c = await resizeImg(file, 220); url = c.toDataURL('image/jpeg', 0.7); }
    sh._cover = url;
    if (pv) { pv.style.backgroundImage = `url('${url}')`; pv.textContent = ''; }
    toast('Foto adicionada — toque em Salvar');
  } catch (e) { toast('Não consegui abrir essa imagem. Tente outra foto.'); }
}
$('#backdrop').addEventListener('click', closeSheet);
(() => { const tip = document.createElement('div'); tip.className = 'ctip'; tip.hidden = true; document.body.appendChild(tip); let cur = null;
  const show = (el, x, y) => { if (cur) cur.classList.remove('hl'); cur = el; el.classList.add('hl'); tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px'; };
  const hide = () => { tip.hidden = true; if (cur) cur.classList.remove('hl'); cur = null; };
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') show(el, e.clientX, e.clientY); else if (e.pointerType === 'mouse') hide(); });
  document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { show(el, e.clientX, e.clientY); } else hide(); });
  window.addEventListener('scroll', hide, { passive: true }); })();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('show')) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickTimer(); } });

/* ---------- modo offline (app instalável) ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
/* ---------- cópias automáticas: uma por dia, guardadas no aparelho (IndexedDB) e, com conta, também na nuvem ---------- */
const BAK_KEEP = 14;
let BAK = { local: [], cloud: [], busy: false };
const bakIdb = () => new Promise((res, rej) => { try { const r = indexedDB.open('rotina-bak', 1); r.onupgradeneeded = () => r.result.createObjectStore('b', { keyPath: 'd' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
const bakTx = async (mode, fn) => { const db = await bakIdb(); return new Promise((res, rej) => { const t = db.transaction('b', mode), out = fn(t.objectStore('b')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
async function bakList() {
  try { BAK.local = ((await bakTx('readonly', s => s.getAll())) || []).map(x => ({ d: x.d, size: x.data.length })).sort((a, b) => b.d.localeCompare(a.d)); } catch (e) { BAK.local = []; }
  if (store.db && store.uid) { try { const d = await store.db.doc(`data/users/${store.uid}/backups`).get(); BAK.cloud = d.exists ? (d.data().v || []) : []; } catch (e) {} }
}
const bakJson = () => JSON.stringify({ app: 'Rotina', version: 1, exported: new Date().toISOString(), auto: true, state: S });
async function autoBackup(force) {
  if (BAK.busy || !S || !S.meta || S.meta.demo) return;
  BAK.busy = true; const d = today();
  try {
    await bakList(); const data = bakJson();
    if (force || !BAK.local.some(x => x.d === d)) {
      await bakTx('readwrite', s => s.put({ d, data }));
      const old = BAK.local.map(x => x.d).filter(x => x !== d).slice(BAK_KEEP - 1);
      if (old.length) await bakTx('readwrite', s => old.forEach(k => s.delete(k)));
    }
    if (store.db && store.uid && (force || !BAK.cloud.some(x => x.d === d))) {
      const assets = await window.claude.use('assets').catch(() => null);
      if (assets) {
        const up = await assets.upload(new Blob([data], { type: 'application/json' }));
        const prev = BAK.cloud.find(x => x.d === d); if (prev) assets.delete(prev.id).catch(() => {});
        let list = [{ d, id: up.id, url: up.url, size: data.length }, ...BAK.cloud.filter(x => x.d !== d)].sort((a, b) => b.d.localeCompare(a.d));
        list.slice(BAK_KEEP).forEach(x => assets.delete(x.id).catch(() => {})); list = list.slice(0, BAK_KEEP);
        await store.db.doc(`data/users/${store.uid}/backups`).set({ v: list });
      }
    }
    await bakList();
  } catch (e) {} finally { BAK.busy = false; }
  if (UI.sub === 'ajustes' && !$('#sheet').classList.contains('show')) render();
}
async function bakData(src, d) {
  if (src === 'local') { const r = await bakTx('readonly', s => s.get(d)); return r && r.data; }
  const x = BAK.cloud.find(y => y.d === d); if (!x) return null; const res = await fetch(x.url || '/_blob/' + x.id); return res.ok ? await res.text() : null;
}
function restoreState(txt) {
  const j = JSON.parse(txt); const st = j.state || j; const base = emptyState();
  if (typeof st !== 'object' || !st.events) throw 0;
  MODULES.forEach(m => S[m] = st[m] ?? base[m]); ensureCareer(); ensureFinance(); S.meta.demo = false;
  persist(...MODULES); Object.keys((S.writing && S.writing.texts) || {}).forEach(persistText);
}
async function saveJson(name, data) {
  try { const dl = window.claude?.use ? await window.claude.use('downloads') : null; if (dl) { await dl.save({ filename: name, data }); return; } } catch (e) { if (e && e.code !== 'unavailable') return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name; a.click(); } catch (e) { toast('Não foi possível baixar aqui'); }
}
function bakSection() {
  const days = [...new Set([...BAK.local.map(x => x.d), ...BAK.cloud.map(x => x.d)])].sort().reverse();
  const kb = n => n > 1e6 ? (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
  const rows = days.map(d => { const l = BAK.local.find(x => x.d === d), c = BAK.cloud.find(x => x.d === d), src = c ? 'cloud' : 'local';
    return `<div class="row"><span class="rk-ic">🗂️</span><div class="main"><div class="t">${fmtDay(d)}${d === today() ? '' : ` · ${WD[parse(d).getDay()]}`}</div><div class="s">${[l && 'neste aparelho', c && 'na sua conta'].filter(Boolean).join(' e ')} · ${kb((l || c).size)}</div></div><div style="display:flex;gap:6px"><button class="btn sm" data-act="bak-get" data-s="${src}" data-k="${d}">Baixar</button><button class="btn sm" data-act="bak-restore" data-s="${src}" data-k="${d}">Restaurar</button></div></div>`; }).join('');
  return `<section class="blk"><div class="blk-h"><h2>Cópias automáticas</h2><span style="color:var(--muted);font-size:13px">uma por dia</span></div>
    <div class="group">${rows || `<div class="empty">${S.meta.demo ? 'As cópias começam quando você sair dos dados de exemplo.' : 'A primeira cópia é feita em instantes.'}</div>`}</div>
    <div class="btns"><button class="btn sm" data-act="bak-now">Fazer uma cópia agora</button></div>
    <p class="note">Todo dia em que você abre o app ele guarda sozinho uma cópia de tudo, ${store.mode === 'conta' ? 'neste aparelho e na sua conta Claude' : 'neste aparelho'}. Ficam as últimas ${BAK_KEEP}. Restaurar troca os dados atuais pelos daquele dia.</p></section>`;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoBackup(); });

/* ---------- início ---------- */
(function boot() {
  const local = loadLocal();
  if (local && local.meta) { const base = emptyState(); S = {}; MODULES.forEach(m => S[m] = local[m] ?? base[m]); }
  else S = demoState();
  normalize(); if (listsSeededNow || colImportedNow) saveLocal();

  UI.tab = mapTab(UI.tab); if (!['foco', 'carreira', 'escritor', 'resumos'].includes(UI.estMode)) UI.estMode = 'foco'; if (!COL_NEST[UI.colMode]) UI.colMode = 'leituras';
  if (!TABS.some(t => t.k === UI.tab)) UI.tab = 'hoje';

})();

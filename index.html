<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rotina</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F13" media="(prefers-color-scheme: dark)">
<meta name="description" content="Organize agenda, treinos, estudos, leituras, finanças e hábitos — funciona offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: app de uma coluna estilo iOS — título grande, seções em grupos, barra de abas fixa embaixo, formulários em folhas que sobem da base. Cada área da vida tem sua cor. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#E8EAF0; --fg:#15171C; --muted:#6A7080; --line:rgba(21,23,28,.09);
  --c-agenda:#3768DB; --c-reun:#C97D12; --c-treino:#DA4E39; --c-fin:#1A9466; --c-estudo:#7656DA; --c-tarefa:#108A88; --c-habito:#CF3F74; --c-leitura:#9B6A3C; --c-escrita:#3D5A80; --c-jogo:#8A7413; --wood:#C9A77E;
  --danger:#D23B3B; --on-accent:#FFFFFF; --tabbar:rgba(248,249,251,.86); --shadow:0 1px 2px rgba(21,23,28,.05),0 6px 20px rgba(21,23,28,.05);
  --f-display:"Bricolage Grotesque",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --f-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --surface:#171A20; --surface-2:#242830; --fg:#ECEEF2; --muted:#8E94A2; --line:rgba(236,238,242,.09);
  --c-agenda:#6E95F2; --c-reun:#E9A23F; --c-treino:#F2735F; --c-fin:#3FC28E; --c-estudo:#9C82F2; --c-tarefa:#35B7B4; --c-habito:#EE6C9B; --c-leitura:#D9A06A; --c-escrita:#8FB0D8; --c-jogo:#D6BF4C; --wood:#6B5038;
  --danger:#F06262; --on-accent:#0D0F13; --tabbar:rgba(23,26,32,.86); --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --surface:#171A20; --surface-2:#242830; --fg:#ECEEF2; --muted:#8E94A2; --line:rgba(236,238,242,.09);
  --c-agenda:#6E95F2; --c-reun:#E9A23F; --c-treino:#F2735F; --c-fin:#3FC28E; --c-estudo:#9C82F2; --c-tarefa:#35B7B4; --c-habito:#EE6C9B; --c-leitura:#D9A06A; --c-escrita:#8FB0D8; --c-jogo:#D6BF4C; --wood:#6B5038;
  --danger:#F06262; --on-accent:#0D0F13; --tabbar:rgba(23,26,32,.86); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--c-agenda);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px;margin-bottom:18px}
.top .eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.top h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;margin:2px 0 0;letter-spacing:-.02em;text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent,var(--c-agenda));font-weight:600;font-size:16px;margin-bottom:6px}
.back svg{width:20px;height:20px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}

section.blk{margin-bottom:26px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 8px}
.blk-h h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.blk-h a,.blk-h button.link{color:var(--accent,var(--c-agenda));font-weight:600;font-size:14px;text-decoration:none}
.group{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;width:100%;text-align:left;position:relative}
.row + .row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.row .end{font-size:14px;color:var(--muted);text-align:right;flex:none}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);flex:none;opacity:.6}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.timebox{width:48px;flex:none;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.timebox small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}

.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);border-color:color-mix(in srgb,var(--muted) 50%,transparent);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;opacity:0;color:var(--on-accent)}
.check.on{background:var(--c,var(--c-tarefa));border-color:var(--c,var(--c-tarefa))}
.check.on svg{opacity:1}
.check.sq{border-radius:8px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:left;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:4px;color:var(--c,var(--fg));font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.sm{font-size:clamp(15px,4.6vw,19px);padding-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.chip.on{background:var(--c);color:var(--on-accent);box-shadow:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}

.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;margin-bottom:14px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--c)}

/* calendário */
.cal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 10px 10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-h b{font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.cal-h div{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent,var(--c-agenda))}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-g .wd{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-g button{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.cal-g button.out{color:var(--muted);opacity:.45}
.cal-g button.today{color:var(--c-agenda);font-weight:800}
.cal-g button.sel{background:var(--c-agenda);color:var(--on-accent);font-weight:700}
.cal-g .dots{display:flex;gap:2px;height:5px}
.cal-g .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal-g button.sel .dots i{background:var(--on-accent)}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent,var(--c-agenda));color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20}
.fab svg{width:26px;height:26px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;letter-spacing:-.01em;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--fg)}
.tabbar button.on svg{color:var(--tc)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,10,14,.42);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 8px;flex:none}
.sheet-h h3{font-family:var(--f-display);font-size:19px;margin:0;flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h button{color:var(--accent,var(--c-agenda));font-weight:600;min-width:64px;text-align:left;padding:6px 0}
.sheet-h .sp{min-width:64px}
.grab{width:38px;height:5px;border-radius:5px;background:var(--surface-2);margin:8px auto 0}
.sheet-b{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.fld > .lbl{font-size:13px;font-weight:600;color:var(--muted);padding-left:4px}
.inp{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:88px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{outline:none;border-color:var(--accent,var(--c-agenda))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:inline-block;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.radios input:checked + span{background:var(--accent,var(--c-agenda));border-color:transparent;color:var(--on-accent)}
.radios input:focus-visible + span{outline:2px solid var(--accent,var(--c-agenda));outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{flex:1;min-width:120px;padding:13px 16px;border-radius:14px;font-weight:700;background:var(--surface);box-shadow:var(--shadow);text-align:center}
.btn.primary{background:var(--accent,var(--c-agenda));color:var(--on-accent);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:var(--on-accent)}
.btn.sm{flex:none;min-width:0;padding:9px 14px;font-size:14px;border-radius:12px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0}
.inline-add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.inline-add .inp{padding:9px 12px;border-radius:10px}
.x{color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex:none}
.x svg{width:16px;height:16px}

.ex-row{display:grid;grid-template-columns:minmax(0,1fr) 52px 60px 64px 30px;gap:6px;align-items:center}
.ex-row .inp{padding:10px 8px;border-radius:10px;text-align:center}
.ex-row .inp:first-child{text-align:left}
.ex-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ex-head span:first-child{padding-left:4px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--c-reun) 13%,var(--surface));border-radius:16px;padding:12px 14px;margin-bottom:20px;font-size:14px}
.banner p{margin:0;flex:1 1 200px;min-width:0}
.banner .btn{flex:none;min-width:0;padding:9px 14px;font-size:14px}

.timer{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer .clock{font-family:var(--f-display);font-size:58px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.timer .ring{width:100%}
.timer .btns{width:100%;margin:0}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week i{width:34px;height:34px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-style:normal;color:var(--fg);font-size:14px}
.week i.on{background:var(--c-treino);color:var(--on-accent);box-shadow:none}
.week i.today{outline:2px solid var(--c-treino);outline-offset:2px}

.hgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.hgrid button{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.hgrid button.on{background:var(--c-habito);color:var(--on-accent)}
.ex-table{width:100%;border-collapse:collapse;font-size:14px}
.ex-table td{padding:6px 0;border-top:1px solid var(--line)}
.ex-table td+td{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px;white-space:nowrap}
.shelf-wrap{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 0 0;overflow:hidden}
.shelf-wrap + .shelf-wrap{margin-top:12px}
.shelf-t{display:flex;justify-content:space-between;padding:0 14px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.shelf{display:flex;align-items:flex-end;gap:5px;padding:4px 14px 0;overflow-x:auto;min-height:150px;border-bottom:12px solid var(--wood);scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.spine{flex:none;width:var(--w,40px);height:var(--h,140px);background:var(--c);color:var(--on-accent);border-radius:4px 4px 1px 1px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12px;font-weight:700;overflow:hidden;box-shadow:inset 3px 0 0 rgba(255,255,255,.18),inset -2px 0 0 rgba(0,0,0,.12)}
.spine span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-height:100%}
.spine small{font-weight:600;opacity:.8;font-size:10px}
.shelf .empty-sp{align-self:center;color:var(--muted);font-size:14px;padding-bottom:20px}
.cover{flex:none;width:44px;height:64px;border-radius:4px;background:var(--c) center/cover no-repeat;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px}
.cover-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.cover-grid .cv{aspect-ratio:2/3;width:100%;border-radius:6px;background:var(--c) center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:flex-end;padding:8px;color:var(--on-accent);font-weight:700;font-size:13px;line-height:1.15;overflow:hidden}
.cover-grid .cv.img{color:transparent}
.cover-grid .ct{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-grid .ca{font-size:12px;color:var(--muted);margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-top{display:flex;gap:14px;align-items:flex-start}
.book-top .cv{width:96px;aspect-ratio:2/3;border-radius:6px;background:var(--c) center/cover no-repeat;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.2);display:grid;place-items:center;color:var(--on-accent);font-size:12px;font-weight:700;text-align:center;padding:6px}
.logger{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.minibars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px;padding:10px 14px 0}
.minibars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted);font-weight:600}
.minibars i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--c-leitura);min-height:2px}
.minibars b{font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums}
.pg{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.pg-head{display:flex;gap:14px;align-items:flex-start}
.pg-title{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.props{display:grid;grid-template-columns:minmax(118px,40%) minmax(0,1fr);column-gap:12px}
.prop-k{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;padding:8px 0;min-width:0}
.prop-k svg{width:16px;height:16px;flex:none;opacity:.85}
.prop-v{font-size:14px;font-weight:600;padding:8px 0;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.prop-v.empty{color:var(--muted);font-weight:400}
.pbox{width:18px;height:18px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;flex:none}

const WRITING_SEED = {"title": "Penumbra", "author": "Maicon Rodrigues", "genre": "Fantasia sombria", "cover": "penumbra/capa.jpg", "color": "var(--c-treino)", "synopsis": "Após testemunhar a ruína de sua própria vida ainda na infância — marcada pela perda brutal da mãe, acusada de bruxaria, e por uma violência que rasga sua inocência — Lyanna carrega dentro de si não apenas dor, mas algo mais antigo… algo que observa, que espera. Os anos passam, mas as feridas não cicatrizam — elas se transformam.\n\nGuiada por forças que sussurram nas sombras e pelo chamado de um poder que corre em seu sangue, Lyanna abandona quem um dia foi. Em um ritual proibido, sob uma lua tingida de vermelho e céus cortados por fogo, ela renasce como algo além de humana.\n\nNão mais vítima.\n\nNão mais criança.\n\nMas Rainha.\n\nAgora, enquanto o mundo ainda acredita controlar o destino, Lyanna caminha entre a vingança e a ascensão, deixando um rastro de temor, fascínio e destruição. Porém, quanto mais ela mergulha na escuridão, mais tênue se torna a linha entre justiça e perdição. E talvez… o verdadeiro monstro não seja aquele que nasce da dor, mas aquele que aprende a amá-la.", "chapters": [{"n": "I", "title": "Cinzas de uma vida antiga", "cover": "penumbra/cap-1.jpg", "text": "No céu, a brisa salgada do mar pesa sobre meu rosto, o Sol ainda brilha para nós, mas não por muito tempo, vejo-o irradiar rosa-avermelhado no horizonte, anunciando seu adormecer e o acordar da noite, está frio, porém não sei se meus tremores são apenas do abraço gelado do vento, não é o que minha mão trêmula de ansiedade sinaliza.\n\nUma vida inteira passa pela minha mente, alegrias, conquistas, dores e anseios, meus piores pesadelos me atormentam, seriam eles que levariam a loucura? Por que essas palavras sussurradas, gritam tanto em minha mente? Acho que estou ficando louca, eles me deixaram louca!\n\nEsse não era o preço que eu tenho de pagar sozinha, hoje a solidão é uma amiga, mas por mais que ela não tenha me abandonado, não cabe a mim aceitar que eles não pagarão por o que tenham feito comigo durante esses anos todos.\n\nImpressionante como daqui o mundo parece parado, fixo, estático, mesmo com o mar dançando junto a suas ondas e cantando uma melodia constante, o observo quase em transe, as vozes se vão, a lua timidamente aparece e a noite se aproxima! Minha mente cantarola uma cantiga antiga como um mantra...seria ela uma profecia ou uma magia?\n\n“...Estrela que traça o céu,\n\nDevolva ao escuro, o brilho adormecido!\n\nPreencha de luz esse coração puro,\n\nDevolva a paz para esse pobre espírito...”\n\nOlho para trás, nesse momento já não se vê o que há dentro da floresta, me levanto, coloco lenha na pequena fogueira que luta contra o frio para sobreviver, acho que eu e ela temos algo em comum, ambas estão famintas, ambas se alimentam daquilo as consome, ela pela madeira e eu pela vingança.\n\nComeço os preparativos, retiro de minha bolsa os instrumentos, um punhal, um frasco com o sangue recém-colhido, de quem desejo me tornar, um caldeirão e 5 velas.\n\nDespida, desenho com meus dedos linhas formando uma estrela ao entorno da fogueira, em cada ponta posiciono uma vela, com a chama da fogueira as acendo.\n\n“Ignis ex anima mea surgat.\n\nFlammae vocem meam audiant.\n\nArde, arde, ignis aeternus.\n\nVoluntas mea te regit.”\n\nPosiciono o caldeirão sob as chamas, o cobre estala, as chamas saltam, no céu, o cometa começa a dar seu sinal de vida e a lua se veste de vermelho, como se tivesse\n\nmergulhado em fogo antigo, carregando nas crateras um segredo que só o universo\n\nentende.\n\n“Salve, Luna, domina mutationis.\n\nSub lumine tuo vetera cadunt, nova surgunt.\n\nSanguis, mens et anima in te renovantur.\n\nMutatio fiat per noctem sacram.\n\nEx tenebris, in lucem renascor.”\n\nAbro o frasco, um cheiro de ferro forte sobe para minhas narinas, o inalo, ainda parece quente, o derramo no caldeirão.\n\n“Mens formam definit. Sanguis tantum oboedit.”\n\nCom punhal em mãos, corto meu pulso em uma linha horizontal, deixo meu sangue cair. “Mens formam definit. Sanguis tantum oboedit.”\n\nNo escuro da noite, vejo o cometa passar pela lua iluminada, refletindo em vermelho sua luz sobre o mundo, meu sangue ainda se despeja, gota a gota e em voz alta continuo clamando.\n\n“Mens formam definit. Sanguis tantum oboedit.”\n\nO mundo parece girar e as chamas dançam, em frenesi ergo minhas mãos, invoco a energia dos pontos. Vou ao ponto superior, minha voz como um estrondo convoco Sowilo.\n\n“Sowilo, lux aeterna, super me fulge.\n\nVoluntatem meam accende et dirige.\n\nMeu sangue se derrama entre meus dedos, a minha esquerda, na base superior chamo por Laguz.\n\n“Laguz, flumen occultum, intra me flue.\n\nIntuitionem meam revela.”\n\nO mar se agita, as ondas batem com força na encosta, e em uma dança frenética circulo a fogueira, o vermelho escuro escorre pelas minhas mãos, me posiciono na ponta inferior esquerda suplico a Algiz.\n\n“Algiz, custos inter mundos,\n\nme protege et custodi.”\n\nO fogo então estala alto, suas chamas agora não mais vermelhas, brilham azuis, deixando todo o meu entorno quente. A cada giro sinto meu corpo se aquecer mais e mais, Sinto a presença de kenaz a minha direita, e urro com força.\n\n“Kenaz, ignis interior,\n\ntransformationem in me accende.”\n\nMinha respiração vibra, me sinto flutuando, o doce néctar vermelho escuro que flui de mim agora respinga no chão, não há mais como interromper. Berkano é invocado.\n\n“Berkano, mater renascentis vitae,\n\nex me novum orbem crea.”\n\nLágrimas e mais lágrimas lavam meus olhos, caem feito cachoeiras pelo meu rosto, sinto o mundo parar, a luz avermelhada da lua me iluminar, a fúria e o calor invadem meu corpo, o momento se aproxima.\n\nA esse ponto, meu sangue misturado com o da Rainha borbulhava e dançavam juntos no caldeirão, eu via, eu sentia! Uma gargalhada me domina.\n\nEla escapa de mim sem controle.\n\nMeus passos ecoavam em estrondo, eu me sentia vagando e me posicionando ao centro da fogueira.\n\n“Per has runas, me ipsum transformo.\n\nEgo fio quod eligam.”\n\nO cobre quente tostava minhas mãos nuas ao retirá-lo do caminho, adentro nas chamas, não mais me reconhecia, uma força primordial me dominava, era bestial, visceral demais para ser descrito... e impossível de conter. Apanho o caldeirão novamente, despejo pelo meu corpo o elixir que será capaz de me libertar.\n\n“Sanguis meus, forma mea,\n\nSolve vinculum carnis.\n\nMutare, mutare, mutare…”\n\nUma tempestade se forma...E em um espasmo minha voz ecoa.\n\n“Mutare, mutare, mutare…”\n\nRaios caem à minha volta, aves gralham na floresta...minha voz se encorpa.\n\n“Mutare, mutare, mutare…”\n\nComo um trovão, gritos e mais gritos convocam minha mutação, minha alma clama, meu espírito ferve.\n\n“Mutare, mutare, mutare…”\n\nO mundo volta a se movimentar, a lua já não mais se veste de vermelho, as chamas já não pulsam, o sangue não mais derrama, ergo as minhas mãos e as observo, no reflexo do recipiente de cobre jogado ao meu lado...aquela que fui não mais está ali.\n\nMinhas mãos...\n\nCuradas.\n\nMeus cabelos…\n\njá não são castanhos.\n\nRuivos. Vivos. Meus.\n\nSorrio.\n\nE então… compreendo.\n\nEstá feito.\n\nOlho para as estrelas, um formigamento percorre meu corpo, o clarão não apenas me ilumina... ele atravessa meu corpo, um estampido rasga o céu, o som vibra dentro de mim, sou atingida, não há fuga, a trovoada desce e se concentra em mim. Respiro.\n\nMeu orgulho desperta.\n\nA partir desta noite… Rowena deixa de existir.\n\nErgo-me como Sua Alteza…\n\nRainha Lyanna.", "notes": "“Fogo, ergue-te da minha alma.\nQue as chamas ouçam minha voz.\nArde, arde, fogo eterno.\nMinha vontade te governa.”\n\n“Salve, Lua, senhora da\ntransformação.\nSob tua luz, o velho cai e o novo surge.\nSangue, mente e alma em ti se renovam.\nQue a transformação aconteça pela noite sagrada.\nDas trevas, renasço na luz.”\nComentado [MR3]: A mente define a forma. O sangue\napenas obedece\n\nA mente define a forma. O sangue\napenas obedece\n\nA mente define a forma. O sangue\napenas obedece\n\n“Sowilo, luz eterna, brilha sobre mim.\nAcende e guia a minha vontade.”\n\n“Laguz, rio oculto, flui dentro de mim.\nRevela a minha intuição.”\n\nAlgiz, guardião entre mundos,\nprotege-me e guarda-me.\n\nKenaz, fogo interior,\nacende a transformação em mim.\n\nBerkano, mãe da vida que renasce,\ncria de mim um novo ser.\n\n“Por estas runas, eu me transformo.\nEu me torno aquilo que escolho.”\n\n“Meu sangue, minha forma,\nliberte o vínculo da carne.\nTransformar, transformar, transformar…”\n\nTransformar, transformar,\ntransformar…”\n\nTransformar, transformar,\ntransformar…”\n\nTransformar, transformar,\ntransformar…”", "status": "Rascunho"}, {"n": "II", "title": "Maringora, nas marés da lembrança", "cover": "penumbra/cap-2.jpg", "text": "Você dorme com a respiração leve, como se o mundo nunca tivesse sido cruel.\n\nE eu fico aqui… contando as linhas do seu rosto, tentando lembrar em que momento a dor deixou de ser tudo.\n\nNem sempre consigo.\n\nAqui, observando seu acordar, percebo que não apenas vejo quem você é Rowena...Eu vejo o que me restou. E como hoje, em um dia silencioso, também noto o que quase me perdi tentando te manter viva.\n\n— Você continua me olhando assim e um dia vai descobrir todos os meus segredos.\n\nDigo a Rowena, notando que ela me observa de longe, deitada em seu quarto.\n\nEla abre uma expressão sorridente, um pouco constrangida, mas continua me admirando Penteio meus longos cabelos grisalhos, abraçada por essa sensação de ternura que só você foi capaz de trazer de volta em minha vida. Você sempre foi responsável pelas melhoras em minha vida, mesmo quando perdi seu pai.\n\nPensamentos nostálgicos me invadem e sou transportada direto pelo dia que disse a seu pai que estaria esperando nossa menininha.\n\nAs lembranças não vêm como passos… vêm como marés.\n\nSilenciosas, insistentes… e, quando percebo, já estou outra vez ali.\n\nA casa era pequena, quase tímida diante do mundo.\n\nAs paredes guardavam o cheiro das ervas que eu insistia em queimar, como se o aroma pudesse negociar com a doença que te consumia.\n\nVocê já não se levantava havia dias.\n\nSeu corpo… tão forte outrora… agora parecia feito de algo frágil demais para o peso da própria respiração.\n\nE ainda assim, eu hesitei.\n\nFiquei parada à porta por um tempo que não sei medir.\n\nMinhas mãos tremiam — não de medo, não só de medo — mas de tudo aquilo que não cabia em palavras.\n\nAté que entrei.\n\nO chão rangeu sob meus pés, como se anunciasse minha presença antes mesmo que eu tivesse coragem de falar.\n\nVocê virou o rosto devagar… com esforço… mas com aquele mesmo olhar.\n\nSempre aquele olhar.\n\nComo se ainda houvesse tempo.\n\n— Eirina… — sua voz saiu baixa, quebrada, mas ainda era você.\n\nSentei ao seu lado.\n\nDevagar.\n\nComo se qualquer movimento brusco pudesse te desfazer.\n\nMinhas mãos encontraram as suas… quentes demais… vivas demais… como se a febre fosse a última chama insistindo em não se apagar.\n\nEu tentei sorrir.\n\nFalhei.\n\n— Eu preciso te contar uma coisa…\n\nAs palavras ficaram suspensas no ar, pesadas como chuva que se recusa a cair.\n\nEu senti meu peito apertar… e por um instante pensei em não dizer.\n\nPensei em guardar aquilo só pra mim.\n\nPensei em poupar você.\n\nMas não…\n\nVocê sempre mereceu saber.\n\nAproximei mais meu rosto do seu.\n\nMinha testa encostou na sua, como fazíamos nos dias bons.\n\n— Nós… — minha voz falhou —\n\n— Nós vamos ter um filho.\n\nO silêncio que veio depois não foi vazio.\n\nFoi cheio.\n\nCheio de tudo o que poderia ter sido…\n\ne de tudo o que ainda seria, mesmo sem você.\n\nSeus olhos… cansados, opacos… encontraram os meus com uma força que eu já não via há dias.\n\nE então… você sorriu.\n\nNão um sorriso grande.\n\nNão um sorriso fácil.\n\nMas um daqueles que nascem de dentro… de um lugar onde a dor não manda.\n\nSeus dedos apertaram os meus com o pouco de força que ainda tinham.\n\n— Um filho… — você sussurrou, como se estivesse provando a palavra pela primeira vez. Eu assenti… já sem conseguir conter as lágrimas.\n\n— Uma menina… eu sinto que é uma menina.\n\nVocê fechou os olhos por um instante… respirando fundo… como se estivesse guardando aquele momento em algum lugar seguro dentro de si.\n\n— Então… — sua voz veio ainda mais baixa —\n\n— ela vai ter seus olhos.\n\nEu ri… entre lágrimas… aquele riso estranho que só nasce quando o coração não sabe se está quebrando ou se está sendo reconstruído.\n\n— E a sua teimosia — respondi, tentando manter alguma leveza… tentando fingir que aquilo não era uma despedida disfarçada.\n\nMas nós dois sabíamos.\n\nO quarto parecia menor… mais silencioso… como se o mundo lá fora tivesse parado por respeito — ou indiferença, nunca soube distinguir.\n\nVocê levou a mão até meu ventre.\n\nCom dificuldade.\n\nCom cuidado.\n\nComo se já estivesse tocando nela.\n\n— Cuide dela… — você disse, quase num sopro —\n\n— Mesmo quando eu não puder.\n\nMeu peito se partiu ali.\n\nSem som.\n\nSem aviso.\n\nEu cobri sua mão com a minha, segurando firme, como se pudesse impedir o inevitável com força suficiente.\n\n— Nós vamos cuidar… — corrigi, mesmo sabendo que estava mentindo pra nós dois —\n\n— Nós três.\n\nMas dentro de mim… algo já sabia.\n\nAlgo já entendia que aquele momento…\n\nnão era apenas um começo.\n\nEra também um fim.\n\n—\n\nE agora, olhando pra você, Rowena…\n\ntão viva… tão inteira…\n\nEu ainda sinto o calor daquela mão sobre você.\n\nComo se, de algum jeito…\n\nele nunca tivesse ido embora.", "notes": "", "status": "Rascunho"}, {"n": "III", "title": "", "cover": "", "text": "", "notes": "", "status": "Ideia"}, {"n": "IV", "title": "Maré Baixa", "cover": "penumbra/cap-4.jpg", "text": "A vila despertava antes do sol.\n\nNão por disciplina, nem por devoção, mas porque o mar exigia. Sempre exigira.\n\nAs primeiras canoas já riscavam a água escura quando eu abri os olhos. Ainda havia um resto de noite preso ao teto da cabana, um azul profundo dissolvendo-se aos poucos entre as frestas da madeira. O cheiro de sal entrava pela janela torta, misturado ao de peixe, corda molhada e fumaça fria. Era um cheiro antigo, áspero, impossível de separar da vida.\n\nPermaneci deitada por alguns segundos, ouvindo.\n\nAs ondas vinham e iam com a paciência de um animal imenso. Ao longe, gaivotas gritavam sobre os barcos. Mais perto, panelas batiam, portas rangiam, passos cruzavam a areia ainda úmida. A vila inteira parecia feita desses pequenos ruídos, costurada por eles, como se o silêncio ali nunca tivesse aprendido a existir por completo.\n\nDo outro lado do cômodo, minha mãe já estava de pé.\n\nEirene penteava os cabelos diante da bacia de cobre apoiada sobre um banco baixo. Àquela hora, a luz ainda mal tocava seu rosto, mas eu conhecia cada linha dele de cor. Conhecia a serenidade quase severa de seus olhos, a firmeza de suas mãos, a maneira como o cansaço jamais parecia vencer sua postura. Mesmo nas manhãs mais difíceis, havia nela algo de intacto, como se carregasse dentro do peito uma chama silenciosa que o mundo ainda não conseguira apagar.\n\nEu a observei em silêncio.\n\nMinha mãe percebeu sem virar o rosto.\n\n— Você continua me olhando assim e um dia vai descobrir todos os meus segredos.\n\nSorri, ainda envolta na manta fina.\n\n— Eu já sei todos.\n\n— Sabe?\n\n— Sei. Você finge que não sente frio. Finge que não fica cansada. E finge que não me deixa ficar com a última porção de caldo de propósito.\n\nEirene soltou uma breve risada pelo nariz, daquelas que vinham pequenas, mas aqueciam o ambiente inteiro.\n\n— Então sou uma mulher muito previsível.\n\n— Só para mim.\n\nMinha mãe enfim se virou. Havia ternura no gesto, mas também algo mais antigo, mais cauteloso, como se amar alguém fosse sempre encostar o coração numa lâmina.\n\n— Venha. Antes que o dia comece a correr mais rápido do que nós duas.\n\nLevantei. Os pés tocaram o chão frio de terra batida. O vestido simples descansava dobrado sobre a cadeira, ainda com cheiro de sabão forte e vento. Enquanto me vestia, fui até a panela e ergui a tampa, sentindo o vapor leve tocar meu rosto.\n\n— Hoje o mar está calmo, não está?\n\n— Calmo demais — respondeu Eirene, amarrando os cabelos. — E mar calmo demais sempre me deixa desconfiada.\n\nFiz uma careta.\n\n— Você desconfia de tudo.\n\n— E alguém precisa fazer isso.\n\nAproximei-me e ajudei a separar os pequenos molhos de ervas secos sobre a mesa. Alecrimdo-mar, folhas amargas para febre, flores minúsculas que quase ninguém sabia nomear. Eirene conhecia cada planta da encosta, cada raiz escondida entre as pedras, cada chá capaz de baixar uma febre ou arrancar uma dor do corpo. Por isso as mulheres a procuravam quando os filhos ardiam em doença. Por isso os velhos batiam à sua porta nas madrugadas ruins. Por isso alguns homens baixavam a voz ao passar por ela.\n\nAjuda não é uma coisa que o medo suporta por muito tempo.\n\nEu ainda não sabia dizer isso em palavras. Mas já sentia.\n\nNa vila, carinho e desconfiança andavam de mãos dadas.\n\nMais tarde, quando o sol já havia subido um pouco, fomos até a beira da água.\n\nA manhã brilhava com uma tranquilidade enganosa. Redes secavam nos postes, crianças corriam descalças, peixes reluziam em bacias rasas como punhados de metal vivo. Os homens conversavam alto, medindo o vento, o preço do dia, a espessura das nuvens no horizonte. Tudo parecia comum. Tão comum que se tornava fácil acreditar que nada podia romper aquela delicada ordem.\n\nEu gostava disso.\n\nGostava das manhãs em que o mundo parecia saber exatamente o seu lugar. Em que minha mãe separava ervas na sombra e eu podia recolher conchas sem pressa. Em que o mar, por algumas horas, fingia ser manso.\n\nEncontrei uma pequena concha espiralada perto das pedras e corri para mostrá-la.\n\n— Mãe, veja.\n\nEirene pegou a concha na mão, examinou-a como se fosse algo precioso.\n\n— Bonita.\n\n— Parece uma lua.\n\n— Parece mesmo.\n\nInclinei a cabeça.\n\n— Você acha que as coisas guardam sinais?\n\nEla me devolveu a concha.\n\n— Acho que algumas guardam promessas. Outras, avisos. O difícil é saber a diferença. Eu ia perguntar mais, mas um ruído atravessou a praia como um rasgo.\n\nNão foi um grito. Ainda não.\n\nFoi o tipo de silêncio que cai de repente quando muitas pessoas voltam o rosto para a mesma direção.\n\nEirene percebeu primeiro. Seu corpo enrijeceu antes mesmo que os passos surgissem. Eu acompanhei seu olhar e vi um grupo se formando entre as casas, homens vindo depressa, outros parando para assistir, mulheres puxando os filhos para perto. O ar mudou. Não havia vento, mas algo se deslocava, invisível e bruto, arrastando tudo.\n\nUm dos homens da frente era Tomas, o intendente da vila, largo de ombros e de voz, com a barba manchada de cinza e olhos pequenos demais para o próprio rosto.\n\n— Eirene.\n\nEle não gritou. Não precisou. Seu nome já veio carregado de pedra.\n\nMinha mãe se colocou de pé.\n\n— Tomas.\n\nO homem se aproximou até parar a alguns passos de distância. Havia outros com ele. Rostos conhecidos. Mãos conhecidas. Gente que já havia comido do caldo de Eirene, gente que já batera à sua porta à noite pedindo ajuda, gente que agora parecia olhar para ela como se nunca a tivesse visto antes.\n\n— A esposa de Dorian perdeu o bebê esta madrugada — disse Tomas. — E há quem jure ter visto fumaça negra saindo da sua janela ao cair da noite.\n\nFranzi a testa, sem entender.\n\n— Fumaça negra? — repetiu Eirene, quase com incredulidade. — Você reuniu metade da vila por causa de fumaça?\n\n— Por sua causa, uma criança morreu de febre no inverno passado. Por sua causa, o leite secou nas cabras do norte. Por sua causa, a maré tem vindo errada.\n\nA cada frase, mais gente se aproximava.\n\nSenti o coração bater diferente. Não mais rápido. Mais fundo.\n\n— Isso é loucura — disse Eirene, firme. — E vocês sabem disso.\n\n— Sabemos? — rebateu uma mulher da multidão. — Ou fomos cegos por tempo demais?\n\nO const timer = { subjectId: null, start: 0, acc: 0, running: false, goal: 25 };
const elapsed = () => timer.acc + (timer.running ? Date.now() - timer.start : 0);
function tickTimer() {
  const el = $('#clock'); if (!el) return;
  const ms = elapsed(), left = timer.goal * 60000 - ms;
  const show = left > 0 ? left : -left;
  el.textContent = `${left < 0 ? '+' : ''}${pad(Math.floor(show / 60000))}:${pad(Math.floor(show / 1000) % 60)}`;
  const bar = $('#timer-bar'); if (bar) bar.style.width = Math.min(100, ms / (timer.goal * 600)) + '%';
}
setInterval(() => { if (timer.running) tickTimer(); }, 1000);

}

    ${UI.bookView === 'capas' ? ['lendo', 'quero', 'lido'].filter(st => by(st).length).map(st => `<div class="shelf-t" style="padding:12px 4px 8px"><span>${BOOK_ST[st]}</span><span class="num">${by(st).length}</span></div><div class="cover-grid">${by(st).map(b => `<button data-act="open" data-k="livro" data-id="${b.id}"><span class="cv${b.cover ? ' img' : ''}" style="${coverStyle(b)}">${esc(b.title)}</span><span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author || '')}</span></button>`).join('')}</div>`).join('') || '<div class="group"><div class="empty">Toque em + para colocar o primeiro livro na prateleira.</div></div>' : ['lendo', 'quero', 'lido'].map(shelf).join('')}</section>

/* ---------- empréstimos ---------- */
const LOAN_FIELDS = [{ k: 'lent', l: 'Está emprestado', t: 'check' }, { k: 'lentTo', l: 'Para quem', half: 1, ph: 'Nome da pessoa' }, { k: 'lentDate', l: 'Desde quando', t: 'date', half: 1 }];
const loanData = x => { const l = x && curLoan(x); return l ? { lent: true, lentTo: l.to, lentDate: l.date } : { lent: false, lentTo: '', lentDate: today() }; };
function applyLoan(x, o) { x.loans = x.loans || []; const l = curLoan(x); if (o.lent) { if (!o.lentTo) return 'Informe para quem emprestou.'; if (l) { l.to = o.lentTo; l.date = o.lentDate || l.date; } else x.loans.push({ id: newId(), to: o.lentTo, date: o.lentDate || today(), due: '', back: '' }); } else if (l) l.back = today(); return ''; }
function loanSync(form) { const s = () => { const on = form.elements.lent.checked; const r = $('#f-lentTo').closest('.two'); if (r) r.hidden = !on; }; form.addEventListener('change', s); s(); }

/* ---------- jogos ---------- */

/* ---------- busca ---------- */
const norm = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function searchAll(q) {
  const n = norm(q); if (n.length < 2) return [];
  const hit = (...xs) => xs.some(x => norm(x).includes(n));
  const snip = (txt) => { const t = String(txt || ''); const i = norm(t).indexOf(n); if (i < 0) return ''; const a = Math.max(0, i - 30); return (a ? '…' : '') + t.slice(a, i + n.length + 50).replace(/\s+/g, ' ') + '…'; };
  const r = [];
  S.events.forEach(e => { if (hit(e.title, e.notes)) r.push(['Agenda', 'evento', e.id, e.title, `${fmtDay(e.date)}${hit(e.title) ? '' : ' · ' + snip(e.notes)}`, EV_CATS[e.cat]?.[1]]); });
  S.meetings.forEach(m => { if (hit(m.title, m.notes, m.people, ...m.agenda.map(a => a.text), ...m.actions.map(a => a.text))) r.push(['Reuniões', 'reuniao', m.id, m.title, fmtDay(m.date), 'var(--c-reun)']); });
  S.tasks.forEach(t => { if (hit(t.title, t.notes)) r.push(['Tarefas', 'tarefa', t.id, t.title, t.done ? 'Concluída' : (t.due ? fmtDay(t.due) : 'Sem prazo'), 'var(--c-tarefa)']); });
  (S.career?.tasks || []).forEach(t => { if (hit(t.title, t.deliv, t.learn)) r.push(['Carreira', 'carreira', t.id, t.title, `Semana ${t.w} · ${t.status}`, 'var(--c-estudo)']); });
  S.books.forEach(b => { if (hit(b.title, b.author, b.desc, b.summary, b.quotes, curLoan(b)?.to)) r.push(['Leituras', 'livro', b.id, b.title, b.author || '', 'var(--c-leitura)']); });
  S.writing.projects.forEach(p => { if (hit(p.title, p.synopsis)) r.push(['Escritor', 'w-proj', p.id, p.title, `${p.chapters.length} capítulos`, 'var(--c-escrita)']); p.chapters.forEach(c => { const tx = S.writing.texts[c.id]; if (hit(c.title, tx, c.notes)) r.push(['Escritor', 'capitulo', c.id, `${p.title} · Cap. ${c.n} ${c.title || ''}`, hit(c.title) ? `${fmtN(c.words || 0)} palavras` : snip(tx || c.notes), 'var(--c-escrita)']); }); });
  S.games.forEach(g => { const l = curLoan(g); if (hit(g.name, g.desc, g.cat, l && l.to)) r.push(['Jogos', 'jogo', g.id, g.name, l ? 'Emprestado para ' + l.to : g.cat, 'var(--c-jogo)']); });
  S.finance.tx.forEach(t => { if (hit(t.desc, t.cat)) r.push(['Finanças', 'lancamento', t.id, t.desc || t.cat, `${fmtDay(t.date)} · ${t.type === 'in' ? '+' : '−'} ${money(t.amount)}`, 'var(--c-fin)']); });
  S.finance.purchases.forEach(p => { if (hit(p.desc, p.cat)) r.push(['Finanças', 'compra', p.id, p.desc, `${fmtDay(p.date)} · ${money(p.amount)}`, 'var(--c-fin)']); });
  return r.slice(0, 60);
}

function alertsCard() {
  const t = today(), in3 = iso(addDays(new Date(), 3)), out = [];
  const late = S.tasks.filter(x => !x.done && x.due && x.due < t).length; if (late) out.push([`${late} ${late === 1 ? 'tarefa atrasada' : 'tarefas atrasadas'}`, 'Ver tarefas', 'sub', 'tarefas', 'var(--danger)']);
  const bills = [...S.finance.tx.filter(x => x.type === 'out' && !x.paid && x.date <= in3).map(x => ({ d: x.date, v: x.amount, n: x.desc || x.cat })), ...S.finance.cards.flatMap(c => invoices(c).filter(v => !v.paid && v.total > 0 && v.state !== 'Futura' && v.due <= in3).map(v => ({ d: v.due, v: v.total, n: 'Fatura ' + c.name })))];
  if (bills.length) { const over = bills.filter(b => b.d < t).length; out.push([`${bills.length} ${bills.length === 1 ? 'conta' : 'contas'} ${over ? `(${over} vencida${over > 1 ? 's' : ''})` : 'vencendo em até 3 dias'} · ${money(bills.reduce((a, b) => a + b.v, 0))}`, 'Abrir finanças', 'tab', 'financas', over ? 'var(--danger)' : 'var(--c-reun)']); }
  const mt = monthTotals(t.slice(0, 7)); if (S.finance.budget && mt.out >= S.finance.budget * 0.8) out.push([`Meta de gastos em ${Math.round(mt.out / S.finance.budget * 100)}%`, 'Ver meta', 'tab', 'financas', mt.out > S.finance.budget ? 'var(--danger)' : 'var(--c-reun)']);
  const w = careerWeek(); const cl = (S.career?.tasks || []).filter(x => x.status === 'A fazer' && x.w < w && x.prazo < t).length; if (cl) out.push([`${cl} ${cl === 1 ? 'tarefa' : 'tarefas'} de carreira ficaram para trás`, 'Ver programa', 'sub', 'carreira', 'var(--c-estudo)']);
  const longLoans = [...S.books, ...S.games].filter(x => { const l = curLoan(x); return l && (l.due ? l.due < t : daysSince(l.date) > 30); }); if (longLoans.length) out.push([`${longLoans.length} ${longLoans.length === 1 ? 'item emprestado' : 'itens emprestados'} há muito tempo`, 'Ver', 'tab', 'jogos', 'var(--c-jogo)']);
  const mNoAgenda = S.meetings.filter(m => m.status !== 'realizada' && m.date >= t && m.date <= iso(addDays(new Date(), 1)) && !m.agenda.length); mNoAgenda.forEach(m => out.push([`Reunião “${m.title}” ${m.date === t ? 'hoje' : 'amanhã'} ainda sem pauta`, 'Montar pauta', 'open-meeting', m.id, 'var(--c-reun)']));
  if (!out.length) return '';
  return `<section class="blk"><div class="blk-h"><h2>Atenção</h2></div><div class="group">${out.map(([txt, lab, act, k, c]) => `<button class="row alert-row" data-act="${act}" data-k="${k}" data-id="${k}"><span class="dot" style="--c:${c}"></span><div class="main"><div class="t" style="font-weight:600">${esc(txt)}</div></div><span class="end" style="color:${c};font-weight:600;font-size:13px">${lab}</span></button>`).join('')}</div></section>`;
}

let sheetClose = null;
function openSheet(title, body, { left = 'Cancelar', right = '', color } = {}) {
  const sh = $('#sheet'), bd = $('#backdrop');
  sh.style.setProperty('--accent', color || accentNow());
  sh.innerHTML = `<div class="grab"></div><div class="sheet-h"><button data-act="close-sheet">${left}</button><h3>${esc(title)}</h3>${right || '<span class="sp"></span>'}</div><div class="sheet-b">${body}</div>`;
  sh._onDelete = null; sh._meeting = null; sh._cover = undefined;
  sh.hidden = false; bd.hidden = false;
  requestAnimationFrame(() => { sh.classList.add('show'); bd.classList.add('show'); });
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  const sh = $('#sheet'), bd = $('#backdrop');
  sh.classList.remove('show'); bd.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => { if (!sh.classList.contains('show')) { sh.hidden = true; bd.hidden = true; sh.innerHTML = ''; } }, 280);
  const cb = sheetClose; sheetClose = null; if (cb) cb();

}

function fieldHtml(f, v) {
  const id = `f-${f.k}`;
  const val = v ?? f.def ?? '';
  const lab = `<label for="${id}">${f.l}</label>`;
  switch (f.t) {
    case 'textarea': return `<div class="fld">${lab}<textarea class="inp" id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea></div>`;
    case 'select': return `<div class="fld">${lab}<select class="inp" id="${id}" name="${f.k}">${f.o.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(val) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;

function shiftMonth(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function toggleIn(arr, v) { const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); }
function meetingText(m) {
  const lines = [`*${m.title}*`, `${fmtDay(m.date)}${m.time ? ' às ' + m.time : ''}${m.place ? ' — ' + m.place : ''}`, '', 'Pauta:'];
  m.agenda.forEach((a, i) => lines.push(`${i + 1}. ${a.text}${a.min ? ` (${a.min} min)` : ''}`));
  if (m.notes) lines.push('', 'Notas:', m.notes);
  if (m.actions.length) { lines.push('', 'Ações:'); m.actions.forEach(a => lines.push(`- ${a.text}${a.owner ? ' — ' + a.owner : ''}${a.done ? ' ✓' : ''}`)); }
  return lines.join('\n');
}

    r.onerror = () => toast('Não consegui ler esse arquivo. Use .txt ou .md.'); r.readAsText(f); t.value = '';
  }
  if (t.id === 'cover-file' && t.files[0]) { setCover(t.files[0]); t.value = ''; }
  if (t.id === 'import-file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result); const st = j.state || j; const base = emptyState();
        if (typeof st !== 'object' || !st.events) throw 0;
        MODULES.forEach(m => S[m] = st[m] ?? base[m]); ensureCareer(); ensureFinance(); S.meta.demo = false;
        persist(...MODULES); toast('Backup importado'); render();
      } catch (err) { toast('Arquivo inválido. Escolha um backup .json do Rotina.'); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});
function resizeImg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => rej(new Error('img')); img.src = url;
  });
}
async function setCover(file) {
  const sh = $('#sheet'), pv = $('#cover-prev');
  try {
    let url = null;
    const assets = (store.db && window.claude?.use) ? await window.claude.use('assets') : null;
    if (assets) {
      const c = await resizeImg(file, 720);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      try { const a = await assets.upload(blob); url = a.url; } catch (e) { url = null; }
    }
    if (!url) { const c = await resizeImg(file, 220); url = c.toDataURL('image/jpeg', 0.7); }
    sh._cover = url;
    if (pv) { pv.style.backgroundImage = `url('${url}')`; pv.textContent = ''; }
    toast('Foto adicionada — toque em Salvar');
  } catch (e) { toast('Não consegui abrir essa imagem. Tente outra foto.'); }
}
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('show')) closeSheet(); });

(function boot() {

  else S = demoState();

  if (!SUBS[UI.sub]) UI.sub = null;
